services:
  neezer:
    # Prebuilt multi-arch image from GHCR (default — no local build needed):
    image: ghcr.io/fnyaker/neezer:latest
    # …or build locally instead (also builds the Svelte web UI) by commenting
    # out `image:` above and uncommenting this:
    # build: .
    container_name: neezer
    restart: unless-stopped
    ports:
      - "5722:5722"
    environment:
      # First-run admin, auto-created on boot (also the Subsonic/web UI login).
      # The pre-rebrand SUPYSONIC_* names are still read (entrypoint fallback).
      NEEZER_ADMIN_USER: ${NEEZER_ADMIN_USER:-${SUPYSONIC_ADMIN_USER:-admin}}
      NEEZER_ADMIN_PASSWORD: ${NEEZER_ADMIN_PASSWORD:-${SUPYSONIC_ADMIN_PASSWORD:-changeme}}
      # Deezer proxy: set DEEZER_ARL to enable it (empty = Deezer disabled).
      DEEZER_ARL: ${DEEZER_ARL:-}
      DEEZER_SYNC_USER: ${NEEZER_ADMIN_USER:-${SUPYSONIC_ADMIN_USER:-admin}}
      DEEZER_QUALITY: ${DEEZER_QUALITY:-FLAC}
      # Auto-sync runs on startup + daily at 04:00 by default; override the time here.
      DEEZER_SYNC_AT: ${DEEZER_SYNC_AT:-}
      # Report what you play back to Deezer so recommendations/Flow keep learning.
      # Off by default (opt-in). Set to "yes" to enable.
      # Database: PostgreSQL, out of the box, served by the `db` service below.
      # POSTGRES_PASSWORD (set it in .env) is the single source of truth — this
      # URI reuses it, so there's nothing to keep in sync by hand. Override
      # DATABASE_URI in .env only if you point at an external Postgres.
      # The database/user names stay `supysonic`: they are the identity of a
      # database that already exists on the volume, and renaming them would make
      # an upgraded stack fail to log in. They are internal, not the brand.
      # If a legacy SQLite database is still on the /data volume, its data is
      # migrated across automatically on first boot (one-shot, transparent).
      DATABASE_URI: ${DATABASE_URI:-postgresql://supysonic:${POSTGRES_PASSWORD:-supysonic}@db:5432/supysonic}
      # Optional concurrency tuning for the web server (defaults: 1 worker /
      # 8 threads / 120s timeout). Raise threads for more simultaneous streams.
      # GUNICORN_THREADS: ${GUNICORN_THREADS:-}
      # GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-}
      # Behind a reverse proxy / TLS? Uncomment these to harden:
      #   - PROXY_HOPS = number of trusted proxies in front (enables ProxyFix so
      #     rate-limiting and logs see the real client IP). Only set it if a
      #     proxy you control is really in front.
      #   - COOKIE_SECURE = yes  -> session cookie only sent over HTTPS.
      # NEEZER_PROXY_HOPS: ${NEEZER_PROXY_HOPS:-${SUPYSONIC_PROXY_HOPS:-}}
      # NEEZER_SESSION_COOKIE_SECURE: ${NEEZER_SESSION_COOKIE_SECURE:-${SUPYSONIC_SESSION_COOKIE_SECURE:-}}
    volumes:
      # Persistent state: caches and the Deezer FLAC archive (the database
      # lives in the `db` service's own volume). The volume key keeps its
      # pre-rebrand name so an existing stack reuses the same data.
      - supysonic-data:/data
      # Optional: an existing local music library (hybrid with Deezer).
      # - /path/to/your/music:/data/music:ro
      # Optional: a full hand-written config instead of the env vars above.
      # Copy config/neezer.conf.example to config/neezer.conf, edit it
      # (it's gitignored — it holds your ARL), then uncomment:
      # - ./config/neezer.conf:/etc/neezer:ro
    # Wait for PostgreSQL to be ready before starting the app.
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL — the default database, started alongside the app. The app's
  # DATABASE_URI above reuses POSTGRES_PASSWORD (set it in .env), so the
  # credentials live in ONE place. To use an external Postgres instead, remove
  # this service and point DATABASE_URI at it in .env.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: neezer-db
    restart: unless-stopped
    environment:
      # Internal names kept from the pre-rebrand stack: an existing PostgreSQL
      # volume is initialised with them, and changing them would lock the app
      # out of its own data. A fresh volume simply gets the same names.
      POSTGRES_DB: supysonic
      POSTGRES_USER: supysonic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supysonic}
    volumes:
      - supysonic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supysonic -d supysonic"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional background daemon: folder watcher + jukebox. Shares the same env,
  # config and /data volume. Uncomment to enable.
  # neezer-daemon:
  #   image: ghcr.io/fnyaker/neezer:latest
  #   # build: .
  #   container_name: neezer-daemon
  #   restart: unless-stopped
  #   command: ["neezer-daemon"]
  #   environment:
  #     DEEZER_ARL: ${DEEZER_ARL:-}
  #     DEEZER_SYNC_USER: ${NEEZER_ADMIN_USER:-${SUPYSONIC_ADMIN_USER:-admin}}
  #     DATABASE_URI: ${DATABASE_URI:-postgresql://supysonic:${POSTGRES_PASSWORD:-supysonic}@db:5432/supysonic}
  #   volumes:
  #     - supysonic-data:/data
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  # Kept from the pre-rebrand compose file on purpose: an existing stack must
  # mount the same volumes after the upgrade, not fresh empty ones.
  supysonic-data:
  # PostgreSQL data.
  supysonic-db:
