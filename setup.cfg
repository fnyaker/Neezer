[metadata]
name = Neezer
version = attr: neezer.VERSION
url = https://github.com/fnyaker/Neezer
download_url = https://github.com/fnyaker/Neezer
author = Nyaker
license = GNU AGPLv3
license_files = LICENSE

description = Deezer-native Subsonic server, a fork of Supysonic
long_description =
    Neezer is a Deezer-native [Subsonic][] server, forked from
    [Supysonic][supysonic] (a Python implementation of the Subsonic server API)
    and wired to a Deezer proxy with its own Svelte web player and Android app.

    Current supported features are:
    * browsing (by folders or tags)
    * streaming of various audio file formats
    * transcoding
    * user or random playlists
    * cover art
    * starred tracks/albums and ratings
    * [Last.FM][lastfm] scrobbling
    * Jukebox mode
    * Deezer library, playlists and favourites, archived as FLAC and
      transcoded to Opus on demand

    Neezer currently targets the version 1.10.2 of the Subsonic API. For more
    details, go check the [API implementation status][docs-api].

    [subsonic]: http://www.subsonic.org/
    [supysonic]: https://github.com/spl0k/supysonic
    [lastfm]: https://www.last.fm/
    [docs-api]: https://github.com/fnyaker/Neezer/blob/master/docs/api.rst

long_description_content_type = text/markdown
keywords = subsonic, music, server

classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Environment :: Web Environment
    Framework :: Flask
    Intended Audience :: End Users/Desktop
    Intended Audience :: System Administrators
    License :: OSI Approved :: GNU Affero General Public License v3
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Multimedia :: Sound/Audio

[options]
python_requires = >=3.10
install_requires =
    argon2-cffi >=21.0.0
    click
    flask >=0.11
    peewee
    Pillow >=9.1.0
    # >=2.32 for HTTPAdapter.build_connection_pool_key_attributes, which is how
    # a podcast episode fetch is pinned to the address the SSRF check validated
    # (see neezer/deezer/provider.py). Older versions still work, minus that.
    requests >=2.32.0
    mediafile
    mutagen
    pycryptodome
    watchdog >=0.8.0
    zipstream-ng >=1.1.0, <2.0.0

packages = find_namespace:
include_package_data = true
zip_safe = false

[options.extras_require]
# Database drivers for the non-default engines (SQLite needs nothing extra).
postgresql =
    psycopg2-binary
mysql =
    PyMySQL
# The genre studio's feature extractor. Optional on purpose: without it the
# embedding module reports itself unavailable and the heuristic classifier in
# deezer/analysis.py keeps doing the job unchanged. numpy comes with
# onnxruntime, which is what the mel front-end is written against. Reading
# vectors back needs NEITHER — see deezer/embedding.py.
embedding =
    onnxruntime
# The YouTube fallback (neezer/deezer/youtube.py): ytmusicapi searches,
# yt-dlp fetches the audio on a first play. yt-dlp-ejs is its challenge solver,
# which runs in a JavaScript runtime (Deno in the image). Without these the
# feature reports itself unavailable and nothing else changes.
youtube =
    yt-dlp >=2026.8.19
    yt-dlp-ejs >=0.8.0
    ytmusicapi >=1.12

[options.packages.find]
include =
    neezer*
    deezerpy*

[options.package_data]
# Built Svelte SPA (vite build -> neezer/webui/dist). Generated, gitignored,
# so it must be listed explicitly to be installed into the package.
neezer.webui =
    dist/*
    dist/*/*
    dist/*/*/*

[options.entry_points]
console_scripts =
    neezer-cli = neezer.cli:main
    neezer-daemon = neezer.daemon:main
    neezer-server = neezer.server:main
    ; Pre-rebrand names, kept so existing scripts, systemd units and container
    ; commands keep working after the upgrade.
    supysonic-cli = neezer.cli:main
    supysonic-daemon = neezer.daemon:main
    supysonic-server = neezer.server:main
