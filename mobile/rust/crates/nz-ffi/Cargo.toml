# The UniFFI surface, and nothing else: records, objects and listeners that
# match the app's screens, converted from `nz-core`'s own types
# (docs/agents/mobile.md, "The FFI boundary").
#
# `crate-type = ["cdylib", "lib"]`: the `cdylib` is `libnz_ffi.so`, loaded by
# JNA from Kotlin and generated into Swift for iOS; the `lib` is what the host
# tests and `cargo test --workspace` build.

[package]
name = "nz-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nz-core = { path = "../nz-core" }
# The Android output's four JNI entry points (lot MB3a's `AudioTrackPull.kt`) are
# resolved BY NAME at runtime, and an unreferenced symbol from an rlib is dropped
# from the cdylib: `src/lib.rs` keeps their address table, and `mobile.yaml`
# reads the four symbols back out of the built `libnz_ffi.so`.
nz-droid-audio = { path = "../nz-droid-audio" }
uniffi = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# `Java_fr_neezer_mobile_bridge_Platform_init` (MB2) hands the platform trust
# store its `Context`: `jni` carries the pointers across, and the verifier is
# what `init_with_env` installs before the first handshake.
jni = { workspace = true }
rustls-platform-verifier = { workspace = true }
