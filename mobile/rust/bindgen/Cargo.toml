# `uniffi-bindgen` — the host-only binary `build-android.sh` runs to turn the
# DEBUG host library's metadata into Kotlin (and, later, Swift).
#
# It MUST read the debug build: `strip = true` on the release profile deletes
# UniFFI's metadata, and bindgen on a stripped library answers "No UniFFI
# metadata found" (docs/agents/mobile.md, "Pitfalls known before the first
# line"). Nothing here is compiled for Android.

[package]
name = "nz-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
