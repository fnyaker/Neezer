# The mobile app's Gradle settings.
#
# Memory: 26 modules, Compose and R8 in one daemon; 4 GB of heap and 1 GB of
# metaspace is what builds this tree on this machine without swapping. Bigger is
# not better here — a fifth Rust build would be running beside it (worker rule
# 8: at most four).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# The feature modules are disjoint by design: Gradle may build them in parallel.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Every module names its own resources: a feature module never sees another's R
# class (the SPA's rule, at the Gradle level).
android.nonTransitiveRClass=true
# R8 full mode (the stronger optimisations), explicit so an AGP default cannot
# change it. The release build is the one the person installs.
android.enableR8.fullMode=true

kotlin.code.style=official

# Maven Central answers 429 to a shared runner IP (3 red runs, 2026-11): Gradle
# retries a transient repository error itself before the workflow-level retry.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
