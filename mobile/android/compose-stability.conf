// UniFFI's generated Kotlin is what Compose cannot see through on its own:
// every `uniffi.nz_ffi` record is a `data class` with `List` fields, which the
// Compose compiler marks UNSTABLE and then recomposes EVERY row of a list on
// every change (docs/agents/mobile.md, "Pitfalls known before the first line").
// Declaring the package stable makes a `TrackRow` a stable parameter, so a list
// of 4 000 rows recomposes only the rows that changed.
//
// Read by `composeCompiler { stabilityConfigurationFiles.add(...) }` in :app and
// :designsystem. `:bridge` itself has no Compose code: the file lives here, at
// the project's root, because it names a package TWO modules compile against.
uniffi.nz_ffi.*
