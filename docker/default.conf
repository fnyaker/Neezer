; Default config baked into the image at /etc/neezer so the container boots
; out of the box (paths under the /data volume). Mounting your own file at
; /etc/neezer overrides this entirely - see config/neezer.conf.example to
; enable the Deezer proxy.

[base]
; PostgreSQL by default (the compose `db` service). The entrypoint overrides
; this with DATABASE_URI from the environment when set, so compose/.env are the
; single source of truth for the credentials. The names stay `supysonic`: an
; existing PostgreSQL volume was initialised with them (internal, not brand).
database_uri = postgresql://supysonic:supysonic@db:5432/supysonic

[webapp]
cache_dir = /data/cache
cache_size = 512
transcode_cache_size = 2048
log_level = INFO
log_rotate = no

[transcoding]
; Transcode to Opus. In your Subsonic client, request lossless to get the
; original FLAC, or set a bitrate (e.g. 320 / 128 / 64) to get Opus at that rate.
; -ac 2 is not cosmetic: libopus caps its rate at 256 kbit/s PER CHANNEL and
; refuses the whole encode beyond it (a mono source at maxBitRate=320 fails with
; "The bit rate 320000 bps is unsupported"), where the same 320k on a stereo
; source is fine. A command template carries one rate and no channel count, so
; it pins the output to stereo — a no-op on the stereo audio nearly all of a
; library is, a downmix for the rest — which makes every rate up to 512k valid.
transcoder_flac_opus = ffmpeg -i %srcpath -v 0 -map 0:a:0 -ac 2 -c:a libopus -b:a %outratek -vbr on -f ogg -
transcoder_mp3_opus = ffmpeg -i %srcpath -v 0 -map 0:a:0 -ac 2 -c:a libopus -b:a %outratek -vbr on -f ogg -
transcoder = ffmpeg -i %srcpath -ab %outratek -v 0 -f %outfmt -
default_transcode_target = opus

[mimetypes]
opus = audio/ogg

[daemon]
socket = /data/neezer.sock
log_level = INFO
log_rotate = no

[deezer]
enabled = no
archive_dir = /data/archive
