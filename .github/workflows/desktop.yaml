name: Desktop

# The GPUI desktop app's workspace (desktop/): format, lints, tests, a release
# build of both binaries (neezer-desktop, neezer-transcribe) and a real
# headless launch of its window under Xvfb.
#
# The system dependency list IS the point of this workflow. A fresh Ubuntu has
# none of what GPUI (xkbcommon, Wayland/X11, fontconfig, freetype, Vulkan),
# cpal's PipeWire host (libpipewire, ALSA) and whisper.cpp's Vulkan backend
# (the Vulkan HEADERS, not only the loader, plus glslc) need. Zed's
# `script/linux` is the reference for the GPUI side; the Vulkan-headers recipe
# is the whisper.cpp build script's. Getting this wrong is cheap to fix here
# and expensive on a person's laptop.
#
# Paths: the app links the repository's Rust crates (webapp/rhythm,
# webapp/appcore, android/nscore), and it speaks the server's /api surface, so
# a change there re-runs this workflow too.
#
# The jobs are independent and run together (GitHub runs every job without a
# `needs` at the same time), so the workflow's duration is its LONGEST job, not
# the sum:
#
#   fmt, audit   seconds
#   clippy       the workspace, linted (debug profile)
#   test         the workspace's suite + the real window under Xvfb + the API
#                and transcription benches
#   floor        the engine children (x86-64-v3/v4) and the CPU-floor proof —
#                its own job since 2026-11-18: it was ~10 min of `test`'s
#                critical path and shares nothing with it but the target dir
#   build        the release binaries (uploaded)

on:
  push:
    branches:
      - master
    paths:
      - desktop/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - android/nscore/**
      - neezer/webui/**
      - neezer/api/**
      - neezer/transcribe/**
      - tools/perf_api.py
      - .github/workflows/desktop.yaml
      # The composite action the `System dependencies` steps call: a change to it
      # is a change to what every job installs.
      - .github/actions/**
  pull_request:
    paths:
      - desktop/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - android/nscore/**
      - neezer/webui/**
      - neezer/api/**
      - neezer/transcribe/**
      - tools/perf_api.py
      - .github/workflows/desktop.yaml
      # The composite action the `System dependencies` steps call: a change to it
      # is a change to what every job installs.
      - .github/actions/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deterministic lints: `clippy -D warnings` against a moving `stable` goes red
  # on a toolchain release instead of on a change. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  # Everything GPUI, cpal's PipeWire host, whisper.cpp's Vulkan backend and the
  # Rust glue around them link against (Zed's script/linux, plus PipeWire, ALSA
  # and D-Bus). One list, used by every job that builds anything.
  #
  # `ffmpeg` is D5's: its tests decode REAL audio — two FLACs cut from one sine
  # (the gapless seam), an Ogg Opus (pre-skip), a 44.1 kHz FLAC (resampling).
  # It is the only encoder in the stack, and the runner image is not a contract.
  # (A comment INSIDE the folded `>` block below becomes a package name: apt
  # tried to install "seam)," and failed every job. Keep comments out here.)
  #
  # This list is the cache key of every `System dependencies` step
  # (`.github/actions/cached-apt` hashes it, with the runner image): changing it
  # is a new cache, and the four jobs download only the difference.
  APT_DEPS: >
    build-essential clang cmake pkg-config
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libvulkan-dev glslc mesa-vulkan-drivers
    libasound2-dev libpipewire-0.3-dev libdbus-1-dev
    libfontconfig-dev libfreetype-dev libglib2.0-dev libzstd-dev libssl-dev
    xvfb xauth
    ffmpeg

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        # The desktop workspace ONLY. `--all` also formats every local
        # path-dependency, and `webapp/rhythm`, `webapp/appcore` and
        # `android/nscore` are hand-formatted on purpose (rhythm's layout is
        # read as a picture; its committed `.wasm` carries a hash of the exact
        # source bytes). `cargo fmt --check` still checks every member.
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: System dependencies
        uses: ./.github/actions/cached-apt
        with:
          line: desktop
          packages: ${{ env.APT_DEPS }}
      # whisper.cpp's CMake build needs the Vulkan HEADERS on the include path;
      # on Linux `whisper-rs-sys` does not read VULKAN_SDK itself, CMake's
      # `FindVulkan` does. CI keeps them in $RUNNER_TEMP so no system package
      # is required (Arch's `vulkan-headers` + `shaderc` are the local
      # equivalents).
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      # ggml is compiled with `-march=native` (its `GGML_NATIVE` default), so the
      # objects in `target/` belong to the CPU that produced them — and this cache
      # never looked at the CPU: run 44240162634 restored (`full match: false`, a
      # partial restore) an object built on a runner with AVX-512, and the engine
      # child died with `SIGILL (signal 4)` on the runner that got it. The
      # fingerprint is the model and the flags line, hashed: another runner model is
      # another cache, never a binary that traps.
      - name: The runner's CPU, as a cache key
        id: cpu
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          fingerprint="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $fingerprint)"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # IN THE PREFIX, not in `key:`: on an exact miss rust-cache falls back to a
          # broader prefix, and a `key:`-only fingerprint would still restore another
          # CPU's objects through that fallback.
          # ... and the floors the three engine children are built for: this
          # entry cannot be reused after a floor change either (docs/agents/
          # desktop.md, *The CPU floor*).
          prefix-key: v0-rust-cpu-${{ steps.cpu.outputs.fingerprint }}-ggml-x86-64-v2-v3-v4
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test + window
    runs-on: ubuntu-24.04
    # 60, not 40: since #329 the cache key names the runner's CPU, so a model this
    # repository has never run on is a COLD build by design (~37 min measured on the
    # first such run, engine children included). Those children and the CPU-floor
    # proof moved to the `floor` job on 2026-11-18 (~10 min off this job's path);
    # the timeout keeps its headroom rather than tracking the warm number, because
    # a too-tight one turns a cold run into a red one.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        uses: ./.github/actions/cached-apt
        with:
          line: desktop
          packages: ${{ env.APT_DEPS }}
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      # ggml is compiled with `-march=native` (its `GGML_NATIVE` default), so the
      # objects in `target/` belong to the CPU that produced them — and this cache
      # never looked at the CPU: run 44240162634 restored (`full match: false`, a
      # partial restore) an object built on a runner with AVX-512, and the engine
      # child died with `SIGILL (signal 4)` on the runner that got it. The
      # fingerprint is the model and the flags line, hashed: another runner model is
      # another cache, never a binary that traps.
      - name: The runner's CPU, as a cache key
        id: cpu
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          fingerprint="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $fingerprint)"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # IN THE PREFIX, not in `key:`: on an exact miss rust-cache falls back to a
          # broader prefix, and a `key:`-only fingerprint would still restore another
          # CPU's objects through that fallback.
          # ... and the floors the three engine children are built for: this
          # entry cannot be reused after a floor change either (docs/agents/
          # desktop.md, *The CPU floor*).
          prefix-key: v0-rust-cpu-${{ steps.cpu.outputs.fingerprint }}-ggml-x86-64-v2-v3-v4
      # The Python server comes FIRST: `cargo test` runs two benches that start
      # `tools/perf_api.py` themselves — `nz-api`'s session round trip (D2,
      # login → me → 401 on a real Flask cookie) and, later, `nz-transcribe`'s
      # worker protocol (T3). Without it the first `cargo test` has no `peewee`
      # and fails for a reason that has nothing to do with the change.
      - name: Set up Python for the API benches
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server the benches start
        run: pip install --disable-pip-version-check -e .
        working-directory: ${{ github.workspace }}
      # Local transcription is proven on a REAL model, not a stub: eleven seconds
      # of speech (whisper.cpp's `jfk.wav`, at the tag this build vendors) go
      # through `neezer-transcribe file` on the CPU and on `lavapipe` (the
      # software Vulkan device `mesa-vulkan-drivers` installs), and the two
      # transcripts must be identical. `ggml-tiny` is 78 MB, so it is cached by
      # its pinned sizes and hashes: a bumped model is a new key, never a silent
      # change, and both files are checked with `sha256sum -c` on every run.
      - name: Cache the transcription fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-fixtures-tiny-be07e048-59dfb9a4
      - name: Fetch the transcription fixtures (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          cd "$RUNNER_TEMP/whisper"
          test -f ggml-tiny.bin || curl -sSLo ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          test -f jfk.wav || curl -sSLo jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" \
            | sha256sum -c -
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" \
            | sha256sum -c -
      - name: Test the workspace
        run: cargo test --workspace --locked
        env:
          NZ_WHISPER_MODEL: ${{ runner.temp }}/whisper/ggml-tiny.bin
          NZ_WHISPER_AUDIO: ${{ runner.temp }}/whisper/jfk.wav
          # Fail the run when the runner has no Vulkan device at all: the point
          # of this job is that `lavapipe` transcribes, not that the CPU does.
          NZ_REQUIRE_VULKAN: "1"
          # ggml's Vulkan backend only keeps `DISCRETE_GPU` and `INTEGRATED_GPU`
          # devices; `lavapipe` reports `CPU`, so without this it is invisible
          # and the probe answers `no_vulkan_device` on a runner where the
          # software device is installed and works. `GGML_VK_VISIBLE_DEVICES`
          # names the device index unconditionally (ggml-vulkan.cpp, the
          # `CUDA_VISIBLE_DEVICES` emulation).
          GGML_VK_VISIBLE_DEVICES: "0"
      # A test that dies without saying why leaves the kernel as the only
      # witness: an OOM kill names the process and its cgroup, and `/proc/
      # pressure/memory` says how much pressure there was. It runs only when the
      # suite failed, costs nothing on a green run, and it is what would have
      # named run 44200808004's killer — 4 engine children dead by a signal the
      # harness reported as `(None)` (docs/agents/desktop.md, T2's *a dead engine
      # NAMES ITS SIGNAL*). `continue-on-error` so a missing `dmesg` permission
      # never turns one failure into two.
      - name: Why a test died (kernel log, memory pressure)
        if: failure()
        continue-on-error: true
        run: |
          free -m || true
          cat /proc/pressure/memory || true
          sudo dmesg --ctime | tail -60 || true
      # Discovery is the one part of the LAN exchange a unit test cannot prove: it
      # needs two processes, multicast on an interface, and a goodbye. `tools/netns.sh`
      # gives them a user network namespace (`unshare -rn`) with a dummy interface —
      # no sudo, no libvirt, and no route out, so the runner's network is untouched
      # (docs/agents/lan-nodes.md, LN3). GitHub's Ubuntu 24.04 images restrict
      # unprivileged user namespaces through AppArmor, so the sysctl goes first;
      # `NZ_LAN_REQUIRE_NETNS=1` then turns "no namespace" into a FAILURE, where a
      # developer machine gets the same situation as a printed skip. The step prints
      # its measurements (discovery p50/p95, announce, goodbye) in the log.
      - name: Discovery across two processes in a user network namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cargo test -p nz-lan --test discovery --locked \
            the_netns_harness_finds_the_other_process -- --exact --nocapture
        env:
          NZ_LAN_REQUIRE_NETNS: "1"
      # v1.6.0 asked its own server for `/apihttps://huggingface.co/…` and every
      # model download in Réglages → Transcription locale was a 404. The suite
      # pins the URL's shape and the request target against a loopback server
      # (no network); this step is the other half — the pinned hosts must still
      # ANSWER. It is a `HEAD` per URL (no model bytes): the redirect chain is
      # followed, the final status must be `200`, and the CDN's `Content-Length`
      # must equal the byte count the crate pins, which is what catches a file
      # re-uploaded under the same name between releases. This job already needs
      # huggingface.co reachable (the fixture fetch above), so it adds no failure
      # mode of its own.
      - name: The pinned model hosts still serve every pinned file
        run: cargo test -p neezer-desktop --locked the_pinned_hosts_still_serve -- --ignored --nocapture
      # `nz-model` is proven against the REAL server's answers, not a sample: the
      # committed fixtures under `crates/nz-model/tests/fixtures/` are regenerated
      # here from THIS commit's server, and the same test then reads what was just
      # written. A payload change that would break the desktop fails this job
      # (docs/agents/desktop.md, lot D1). The bench is throwaway SQLite in a temp
      # directory: it never touches a real install.
      - name: Regenerate the API fixtures from this commit's server
        run: python desktop/tools/dump_fixtures.py --out "$RUNNER_TEMP/fixtures"
        working-directory: ${{ github.workspace }}
      # T1's golden corpus is written by the Python functions
      # (`neezer/transcribe/engine.py`, `sidecar.py`), never by the Rust port.
      # `cargo test --workspace` already catches a RUST drift (it compares
      # against the committed files); this step is the other direction, and the
      # only one that catches a change in Python: a space added to
      # `clean_text`, a rounded offset moved by a millisecond.
      - name: The transcription corpus still matches its Python writers
        run: python desktop/tools/transcribe_golden.py --check
        working-directory: ${{ github.workspace }}
      - name: Test nz-model against the freshly regenerated fixtures
        run: cargo test -p nz-model --locked
        env:
          NZ_FIXTURES_DIR: ${{ runner.temp }}/fixtures
      # `cargo test` builds the test harnesses, not the binaries themselves:
      # the two launch steps below need the real executables.
      - name: Build the debug binaries
        run: cargo build --workspace --locked
      # The window is the one thing a unit test cannot prove: it opens a real
      # GPU surface. Xvfb + lavapipe (mesa-vulkan-drivers) give it one, and the
      # binary prints the time to the first painted frame before quitting.
      - name: The window opens and quits on its first frame
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./target/debug/neezer-desktop --self-test-quit-after-first-frame \
            | tee "$RUNNER_TEMP/first-frame.log"
          grep -E '^first_frame_ms=[0-9]+$' "$RUNNER_TEMP/first-frame.log"
      - name: The transcription binary reports what it links
        run: ./target/debug/neezer-transcribe --version

  # The engine children and the CPU-floor proof, on their own since 2026-11-18.
  #
  # WHY THIS IS A JOB AND NOT THE TAIL OF `cargo test + window`: nothing here
  # shares anything with the suite except the target directory, and it was ~10
  # min of that job's critical path (`Build the x86-64-v3 and x86-64-v4 engine
  # children` median 5.83 min + `Both CPU floors hold` median 4.15 min, over 8
  # successful runs). Every job without a `needs` runs at the same time, so the
  # workflow is now its longest job (~18 min, `release binaries`) instead of the
  # sum. EVERY step below is unchanged, on the same binaries, with the same
  # assertions: this is a move, not a lighter check.
  #
  # It keeps its OWN Rust cache (no `shared-key`): the two jobs hold different
  # artifacts (this one adds `target/engine-v3` and `-v4`), and one shared entry
  # would be overwritten by whichever job finished last, so the children would
  # be rebuilt cold half the time. The cost is one cold run, once.
  floor:
    name: CPU floor (engine children)
    runs-on: ubuntu-24.04
    # 60 like `cargo test + window`, for the same reason: a cache miss on a
    # runner model this repository has never seen is a COLD build by design
    # (~37 min measured before the floor work moved here; ~20 min for this job
    # alone), so the timeout must not turn that into a red run.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        uses: ./.github/actions/cached-apt
        with:
          line: desktop
          packages: ${{ env.APT_DEPS }}
      # whisper.cpp's CMake build needs the Vulkan HEADERS on the include path;
      # on Linux `whisper-rs-sys` does not read VULKAN_SDK itself, CMake's
      # `FindVulkan` does. CI keeps them in $RUNNER_TEMP so no system package
      # is required (Arch's `vulkan-headers` + `shaderc` are the local
      # equivalents).
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      # ggml is compiled with `-march=native` (its `GGML_NATIVE` default), so the
      # objects in `target/` belong to the CPU that produced them — and this cache
      # never looked at the CPU: run 44240162634 restored (`full match: false`, a
      # partial restore) an object built on a runner with AVX-512, and the engine
      # child died with `SIGILL (signal 4)` on the runner that got it. The
      # fingerprint is the model and the flags line, hashed: another runner model is
      # another cache, never a binary that traps.
      - name: The runner's CPU, as a cache key
        id: cpu
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          fingerprint="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $fingerprint)"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # IN THE PREFIX, not in `key:`: on an exact miss rust-cache falls back to a
          # broader prefix, and a `key:`-only fingerprint would still restore another
          # CPU's objects through that fallback.
          # ... and the floors the three engine children are built for: this
          # entry cannot be reused after a floor change either (docs/agents/
          # desktop.md, *The CPU floor*).
          prefix-key: v0-rust-cpu-${{ steps.cpu.outputs.fingerprint }}-ggml-x86-64-v2-v3-v4
      # Local transcription is proven on a REAL model, not a stub: eleven seconds
      # of speech (whisper.cpp's `jfk.wav`, at the tag this build vendors) go
      # through `neezer-transcribe file` on the CPU and on `lavapipe` (the
      # software Vulkan device `mesa-vulkan-drivers` installs), and the two
      # transcripts must be identical. `ggml-tiny` is 78 MB, so it is cached by
      # its pinned sizes and hashes: a bumped model is a new key, never a silent
      # change, and both files are checked with `sha256sum -c` on every run.
      - name: Cache the transcription fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-fixtures-tiny-be07e048-59dfb9a4
      - name: Fetch the transcription fixtures (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          cd "$RUNNER_TEMP/whisper"
          test -f ggml-tiny.bin || curl -sSLo ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          test -f jfk.wav || curl -sSLo jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" \
            | sha256sum -c -
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" \
            | sha256sum -c -
      # The floor binary the census, the emulated run and the dispatch all read.
      # `cargo test` builds the test harnesses, not the binaries themselves.
      - name: Build the debug binaries
        run: cargo build --workspace --locked

      # The x86-64-v3 and x86-64-v4 engine children, beside the floor one: the
      # supervisor starts the best child the CPU can run, and this job is where
      # the three are exercised (docs/agents/desktop.md, *The CPU floor, and the
      # child that picks its own ISA*). ~2 min each: a second whisper build, in
      # its own target.
      - name: Build the x86-64-v3 and x86-64-v4 engine children
        run: tools/build_engine_variants.sh --debug
      # WHY AN ENGINE CHILD COULD DIE, AND WHAT IT WAS BUILT FOR: the runner's CPU
      # against the ISA that reached ggml. Every `SIGILL` this job has had was the
      # two disagreeing (ggml compiles an AMX path under `__AMX_INT8__ &&
      # __AVX512VNNI__` — the `AMX is not ready to be used!` line of run
      # 44234946582). `always()` so a red run still says which side it died on.
      - name: Why an engine child died — the runner's CPU and the ISA ggml got
        if: always()
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2)"
          for flag in sse4_2 popcnt avx avx2 avx512f avx512vnni fma f16c bmi2 amx_tile; do
            case " $flags " in *" $flag "*) printf '%s ' "$flag" ;; esac
          done; echo
          grep -hE '^GGML_(NATIVE|SSE42|AVX|AVX2|AVX512|FMA|F16C|BMI2|AMX)' \
            target/debug/build/whisper-rs-sys-*/out/build/CMakeCache.txt || true
          for tree in target/debug target/engine-v3/debug; do
            if grep -qs -- '-march=native' "$tree"/build/whisper-rs-sys-*/out/build/compile_commands.json; then
              echo "-march=native a atteint ggml dans $tree : c'est le défaut que" >&2
              echo "desktop/.cargo/config.toml existe pour empêcher." >&2
            fi
          done
      # The artefacts ship to laptops whose CPU is older than the runner's, so both
      # floors are checked on the binaries this job just built: each census, each
      # variant's ggml objects gated at its own level, the floor binary transcribing
      # under an EMULATED x86-64-v2 CPU, the `-v3` one natively, and the dispatch.
      - name: Both CPU floors hold, and the dispatch picks right
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user
          tools/check_cpu_floor.sh target/debug/neezer-transcribe
        env:
          NZ_WHISPER_MODEL: ${{ runner.temp }}/whisper/ggml-tiny.bin
          NZ_WHISPER_AUDIO: ${{ runner.temp }}/whisper/jfk.wav

  build:
    name: release binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        uses: ./.github/actions/cached-apt
        with:
          line: desktop
          packages: ${{ env.APT_DEPS }}
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      # ggml is compiled with `-march=native` (its `GGML_NATIVE` default), so the
      # objects in `target/` belong to the CPU that produced them — and this cache
      # never looked at the CPU: run 44240162634 restored (`full match: false`, a
      # partial restore) an object built on a runner with AVX-512, and the engine
      # child died with `SIGILL (signal 4)` on the runner that got it. The
      # fingerprint is the model and the flags line, hashed: another runner model is
      # another cache, never a binary that traps.
      - name: The runner's CPU, as a cache key
        id: cpu
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          fingerprint="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $fingerprint)"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # IN THE PREFIX, not in `key:`: on an exact miss rust-cache falls back to a
          # broader prefix, and a `key:`-only fingerprint would still restore another
          # CPU's objects through that fallback.
          # ... and the floors the three engine children are built for: this
          # entry cannot be reused after a floor change either (docs/agents/
          # desktop.md, *The CPU floor*).
          prefix-key: v0-rust-cpu-${{ steps.cpu.outputs.fingerprint }}-ggml-x86-64-v2-v3-v4
      - name: Build the two binaries
        run: cargo build --release --locked --workspace
      - name: Build the x86-64-v3 and x86-64-v4 engine children
        run: tools/build_engine_variants.sh --release
      - name: Binary sizes
        run: |
          du -h target/release/neezer-desktop target/release/neezer-transcribe \
            target/release/neezer-transcribe-v3 target/release/neezer-transcribe-v4
      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-linux-x86_64
          path: |
            desktop/target/release/neezer-desktop
            desktop/target/release/neezer-transcribe
            desktop/target/release/neezer-transcribe-v3
            desktop/target/release/neezer-transcribe-v4
          if-no-files-found: error
          retention-days: 7

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RustSec advisories against the committed Cargo.lock: the desktop app
      # ships its whole dependency graph, so a finding is a dependency to bump,
      # not a warning to silence.
      - name: Audit dependencies
        run: cargo audit
