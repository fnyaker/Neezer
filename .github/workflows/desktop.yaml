name: Desktop

# The GPUI desktop app's workspace (desktop/): format, lints, tests, a release
# build of both binaries (neezer-desktop, neezer-transcribe) and a real
# headless launch of its window under Xvfb.
#
# The system dependency list IS the point of this workflow. A fresh Ubuntu has
# none of what GPUI (xkbcommon, Wayland/X11, fontconfig, freetype, Vulkan),
# cpal's PipeWire host (libpipewire, ALSA) and whisper.cpp's Vulkan backend
# (the Vulkan HEADERS, not only the loader, plus glslc) need. Zed's
# `script/linux` is the reference for the GPUI side; the Vulkan-headers recipe
# is the whisper.cpp build script's. Getting this wrong is cheap to fix here
# and expensive on a person's laptop.
#
# Paths: the app links the repository's Rust crates (webapp/rhythm,
# webapp/appcore, android/nscore), and it speaks the server's /api surface, so
# a change there re-runs this workflow too.

on:
  push:
    branches:
      - master
    paths:
      - desktop/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - android/nscore/**
      - neezer/webui/**
      - neezer/api/**
      - neezer/transcribe/**
      - tools/perf_api.py
      - .github/workflows/desktop.yaml
  pull_request:
    paths:
      - desktop/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - android/nscore/**
      - neezer/webui/**
      - neezer/api/**
      - neezer/transcribe/**
      - tools/perf_api.py
      - .github/workflows/desktop.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deterministic lints: `clippy -D warnings` against a moving `stable` goes red
  # on a toolchain release instead of on a change. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  # Everything GPUI, cpal's PipeWire host, whisper.cpp's Vulkan backend and the
  # Rust glue around them link against (Zed's script/linux, plus PipeWire, ALSA
  # and D-Bus). One list, used by every job that builds anything.
  #
  # `ffmpeg` is D5's: its tests decode REAL audio — two FLACs cut from one sine
  # (the gapless seam), an Ogg Opus (pre-skip), a 44.1 kHz FLAC (resampling).
  # It is the only encoder in the stack, and the runner image is not a contract.
  # (A comment INSIDE the folded `>` block below becomes a package name: apt
  # tried to install "seam)," and failed every job. Keep comments out here.)
  APT_DEPS: >
    build-essential clang cmake pkg-config
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libvulkan-dev glslc mesa-vulkan-drivers
    libasound2-dev libpipewire-0.3-dev libdbus-1-dev
    libfontconfig-dev libfreetype-dev libglib2.0-dev libzstd-dev libssl-dev
    xvfb xauth
    ffmpeg

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        # The desktop workspace ONLY. `--all` also formats every local
        # path-dependency, and `webapp/rhythm`, `webapp/appcore` and
        # `android/nscore` are hand-formatted on purpose (rhythm's layout is
        # read as a picture; its committed `.wasm` carries a hash of the exact
        # source bytes). `cargo fmt --check` still checks every member.
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      # whisper.cpp's CMake build needs the Vulkan HEADERS on the include path;
      # on Linux `whisper-rs-sys` does not read VULKAN_SDK itself, CMake's
      # `FindVulkan` does. CI keeps them in $RUNNER_TEMP so no system package
      # is required (Arch's `vulkan-headers` + `shaderc` are the local
      # equivalents).
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test + window
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # The Python server comes FIRST: `cargo test` runs two benches that start
      # `tools/perf_api.py` themselves — `nz-api`'s session round trip (D2,
      # login → me → 401 on a real Flask cookie) and, later, `nz-transcribe`'s
      # worker protocol (T3). Without it the first `cargo test` has no `peewee`
      # and fails for a reason that has nothing to do with the change.
      - name: Set up Python for the API benches
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server the benches start
        run: pip install --disable-pip-version-check -e .
        working-directory: ${{ github.workspace }}
      # Local transcription is proven on a REAL model, not a stub: eleven seconds
      # of speech (whisper.cpp's `jfk.wav`, at the tag this build vendors) go
      # through `neezer-transcribe file` on the CPU and on `lavapipe` (the
      # software Vulkan device `mesa-vulkan-drivers` installs), and the two
      # transcripts must be identical. `ggml-tiny` is 78 MB, so it is cached by
      # its pinned sizes and hashes: a bumped model is a new key, never a silent
      # change, and both files are checked with `sha256sum -c` on every run.
      - name: Cache the transcription fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: whisper-fixtures-tiny-be07e048-59dfb9a4
      - name: Fetch the transcription fixtures (SHA-256 pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          cd "$RUNNER_TEMP/whisper"
          test -f ggml-tiny.bin || curl -sSLo ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          test -f jfk.wav || curl -sSLo jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" \
            | sha256sum -c -
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" \
            | sha256sum -c -
      - name: Test the workspace
        run: cargo test --workspace --locked
        env:
          NZ_WHISPER_MODEL: ${{ runner.temp }}/whisper/ggml-tiny.bin
          NZ_WHISPER_AUDIO: ${{ runner.temp }}/whisper/jfk.wav
          # Fail the run when the runner has no Vulkan device at all: the point
          # of this job is that `lavapipe` transcribes, not that the CPU does.
          NZ_REQUIRE_VULKAN: "1"
          # ggml's Vulkan backend only keeps `DISCRETE_GPU` and `INTEGRATED_GPU`
          # devices; `lavapipe` reports `CPU`, so without this it is invisible
          # and the probe answers `no_vulkan_device` on a runner where the
          # software device is installed and works. `GGML_VK_VISIBLE_DEVICES`
          # names the device index unconditionally (ggml-vulkan.cpp, the
          # `CUDA_VISIBLE_DEVICES` emulation).
          GGML_VK_VISIBLE_DEVICES: "0"
      # `nz-model` is proven against the REAL server's answers, not a sample: the
      # committed fixtures under `crates/nz-model/tests/fixtures/` are regenerated
      # here from THIS commit's server, and the same test then reads what was just
      # written. A payload change that would break the desktop fails this job
      # (docs/agents/desktop.md, lot D1). The bench is throwaway SQLite in a temp
      # directory: it never touches a real install.
      - name: Regenerate the API fixtures from this commit's server
        run: python desktop/tools/dump_fixtures.py --out "$RUNNER_TEMP/fixtures"
        working-directory: ${{ github.workspace }}
      # T1's golden corpus is written by the Python functions
      # (`neezer/transcribe/engine.py`, `sidecar.py`), never by the Rust port.
      # `cargo test --workspace` already catches a RUST drift (it compares
      # against the committed files); this step is the other direction, and the
      # only one that catches a change in Python: a space added to
      # `clean_text`, a rounded offset moved by a millisecond.
      - name: The transcription corpus still matches its Python writers
        run: python desktop/tools/transcribe_golden.py --check
        working-directory: ${{ github.workspace }}
      - name: Test nz-model against the freshly regenerated fixtures
        run: cargo test -p nz-model --locked
        env:
          NZ_FIXTURES_DIR: ${{ runner.temp }}/fixtures
      # `cargo test` builds the test harnesses, not the binaries themselves:
      # the two launch steps below need the real executables.
      - name: Build the debug binaries
        run: cargo build --workspace --locked
      # The window is the one thing a unit test cannot prove: it opens a real
      # GPU surface. Xvfb + lavapipe (mesa-vulkan-drivers) give it one, and the
      # binary prints the time to the first painted frame before quitting.
      - name: The window opens and quits on its first frame
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./target/debug/neezer-desktop --self-test-quit-after-first-frame \
            | tee "$RUNNER_TEMP/first-frame.log"
          grep -E '^first_frame_ms=[0-9]+$' "$RUNNER_TEMP/first-frame.log"
      - name: The transcription binary reports what it links
        run: ./target/debug/neezer-transcribe --version

  build:
    name: release binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build the two binaries
        run: cargo build --release --locked --workspace
      - name: Binary sizes
        run: |
          du -h target/release/neezer-desktop target/release/neezer-transcribe
      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-linux-x86_64
          path: |
            desktop/target/release/neezer-desktop
            desktop/target/release/neezer-transcribe
          if-no-files-found: error
          retention-days: 7

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RustSec advisories against the committed Cargo.lock: the desktop app
      # ships its whole dependency graph, so a finding is a dependency to bump,
      # not a warning to silence.
      - name: Audit dependencies
        run: cargo audit
