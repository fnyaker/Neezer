name: Release

# On a v* tag, creates the GitHub release and attaches the files a user needs
# to run a given version without cloning the repository:
#
#   - docker-compose.yml  the stack, with the image pinned to THIS version
#                         (the checked-in file follows :latest)
#   - .env.example        its settings, to copy to .env
#   - neezer-desktop-<ver>-x86_64.pkg.tar.zst
#                         the Omarchy desktop app as an Arch package: `pacman -U`
#                         it and the launcher entry, the icon and both binaries
#                         (`neezer-desktop`, `neezer-transcribe`) are installed
#   - neezer-desktop-<ver>-x86_64.deb / .rpm / .AppImage / .flatpak
#                         the same app for the other Linux desktops, built from
#                         ONE release build of the two binaries (the `binaries`
#                         job) and each installed and started by its own job
#                         before it is attached (desktop/packaging/README.md)
#
# The Android APK is attached to the same release by android.yaml, from the
# same tag. Whichever workflow gets there first creates the release; the others
# add their file to it.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    # Path filters do not apply to tag pushes: a release always here runs,
    # whatever the tagged commit touched. On master, only a change to the
    # packaging rebuilds the package.
    paths:
      - desktop/packaging/**
      - .github/workflows/release.yaml
  pull_request:
    paths:
      - desktop/packaging/**
      - .github/workflows/release.yaml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)attach the release files to
        required: true

permissions:
  contents: write

jobs:
  files:
    name: Attach docker-compose.yml
    # Only a tag (or a dispatch naming one) has a release to attach to; a
    # branch push or a pull request triggers this workflow for the package
    # build below and must leave the releases alone.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # docker/metadata-action (docker.yaml) publishes v1.2.3 as 1.2.3.
      - name: Pin the image to this release
        run: |
          mkdir release
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          sed "s#${IMAGE}:latest#${IMAGE}:${VERSION}#" docker-compose.yml > release/docker-compose.yml
          grep -q "${IMAGE}:${VERSION}" release/docker-compose.yml
          if grep -q ':latest' release/docker-compose.yml; then
            echo "docker-compose.yml still references :latest" >&2
            grep -n ':latest' release/docker-compose.yml >&2
            exit 1
          fi
          cp .env.example release/.env.example

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            release/docker-compose.yml
            release/.env.example

  # The desktop app is how an Omarchy user runs Neezer: one package installs
  # both binaries, the launcher entry and the icon (`makepkg -si` is the
  # documented path, docs/agents/desktop.md, P1). Built in the real Arch
  # container rather than on Ubuntu: `makepkg`, pacman's dependency metadata
  # and the Vulkan headers must be the ones the person's machine has, or
  # `namcap` would be checking a fiction.
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # The crate registry lives outside the checkout so `makepkg --clean`
      # cannot take it, and so one cache entry serves every tag.
      CARGO_HOME: /tmp/cargo
    steps:
      # `rust` provides `cargo`, so it is never named on its own here: pacman
      # would have two providers to choose from and stop to ask, in a
      # non-interactive job. The runtime dependencies are installed too, which
      # is also the check that every name in the PKGBUILD's `depends` exists in
      # the repos (a typo there is a package nobody can install).
      - name: Install the build chain
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git namcap desktop-file-utils \
            rust cmake clang shaderc vulkan-headers fontconfig \
            pipewire alsa-lib libxcb libxkbcommon libxkbcommon-x11 \
            wayland vulkan-icd-loader
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A dispatch names the tag to (re)build; every other event uses its
          # own ref (the tag that was pushed, the pull request's merge, master).
          ref: ${{ github.event.inputs.tag || '' }}
      # `Build the package` below is the workflow's critical path: median 21.47
      # min, max 36.53 min over 8 successful runs — a FULL release build of GPUI,
      # whisper.cpp and the three engine children, from scratch, on every run,
      # because nothing but the crate registry was cached. `makepkg` builds into
      # `$srcdir/target` (the PKGBUILD's `CARGO_TARGET_DIR`), the same path on
      # every run (/__w/Neezer/Neezer/desktop/packaging/arch/src/target), so
      # rust-cache can carry it — and it carries the right part: it saves only
      # the DEPENDENCIES ("In particular, the workspace crates themselves are not
      # cached since doing so is generally not effective", rust-cache README),
      # which is what a fresh checkout can reuse: the 887 packages under the
      # workspace, 90 % of the cost, come back and our own crates are rebuilt.
      #
      # The prefix names the machine, for the reason #329 gives: a `target/`
      # belongs to the CPU that wrote it, and `.cargo/config.toml` fixes ggml's
      # instruction sets there. `pacman -Syu` also moves `rust` under the build,
      # so the toolchain is in the key too. Another runner model or another rustc
      # is another cache, never a binary that traps.
      - name: The CPU and the toolchain, as a cache key
        id: cachekey
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          cpu="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          rust="$(rustc -vV | sha256sum | cut -c1-16)"
          echo "prefix=v0-rust-cpu-$cpu-rustc-$rust-ggml-x86-64-v2-v3-v4" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $cpu), $(rustc -V)"
      # It replaces the crate-registry cache this job used to keep: rust-cache
      # covers CARGO_HOME (registry, git, bin) AND the build tree, and prunes
      # what a week of builds left behind — the 10 GB per repository is shared
      # with the desktop's own entries.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> packaging/arch/src/target
          prefix-key: ${{ steps.cachekey.outputs.prefix }}
      - name: Build the package
        run: |
          set -euo pipefail
          # The release tag names the version; a build of a branch or a pull
          # request keeps the version the Rust workspace declares (0.1.0), so
          # the package built here is the one the tag will ship. The ref comes
          # from the environment, never interpolated into this script.
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then tag="$TAG"; fi
          override=""
          if [[ -n "$tag" ]]; then
            version="${tag#v}"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "tag '$tag' is not v<version>" >&2
              exit 1
            fi
            override="NEEZER_DESKTOP_VERSION=$version"
          fi
          # makepkg refuses to run as root, and the workspace is mounted
          # root-owned: the build belongs to an ordinary user.
          useradd --create-home --shell /bin/bash builder
          mkdir -p /tmp/cargo
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/cargo
          su - builder -c "cd '$GITHUB_WORKSPACE/desktop/packaging/arch' &&
            CARGO_HOME=/tmp/cargo $override makepkg --force --noconfirm"
      - name: namcap and the desktop entry
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/desktop/packaging/arch"
          desktop-file-validate neezer-desktop.desktop
          # `[0-9]` keeps a `neezer-desktop-debug-…` out, should makepkg ever
          # produce one: the release attaches exactly one artefact.
          pkg="$(ls neezer-desktop-[0-9]*.pkg.tar.zst)"
          namcap "$pkg" | tee "$RUNNER_TEMP/namcap-pkg.log"
          namcap PKGBUILD | tee "$RUNNER_TEMP/namcap-pkgbuild.log"
          # Warnings and notes are kept in the log; an ERROR is a defect the
          # release must not ship (a missing dependency is a binary that does
          # not start on the person's machine).
          if grep -qE '(^| )E:' "$RUNNER_TEMP"/namcap-*.log; then
            echo "namcap reported an error" >&2
            exit 1
          fi
      # The Arch package is the Omarchy path — the laptop this app is FOR — and
      # `makepkg` compiles ggml from the same tree with the same
      # `desktop/.cargo/config.toml`, so the floor is checked on the file that
      # installs: `usr/bin/neezer-transcribe`, extracted from the package itself
      # and run under an emulated x86-64-v2 CPU. `--no-ggml`: `makepkg --clean`
      # has removed the build tree, so the objects cannot be gated here — the
      # `binaries` job gates them, and the binary's own run is what this proves
      # (docs/agents/desktop.md, *The CPU floor*).
      - name: The packaged binaries keep their CPU floors and the dispatch picks right
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed qemu-user
          mkdir -p "$RUNNER_TEMP/whisper" "$RUNNER_TEMP/arch-pkg"
          cd "$RUNNER_TEMP/whisper"
          test -f ggml-tiny.bin || curl -sSLo ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          test -f jfk.wav || curl -sSLo jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" \
            | sha256sum -c -
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" \
            | sha256sum -c -
          cd "$RUNNER_TEMP/arch-pkg"
          # Both engine binaries into ONE directory: `engine-program` compares
          # `current_exe()` with the `-v3` sibling, so the dispatch can only be
          # proven with the pair the package installs.
          bsdtar xf "$GITHUB_WORKSPACE"/desktop/packaging/arch/neezer-desktop-[0-9]*.pkg.tar.zst \
            usr/bin/neezer-transcribe usr/bin/neezer-transcribe-v3 usr/bin/neezer-transcribe-v4
          chmod +x usr/bin/neezer-transcribe usr/bin/neezer-transcribe-v3 usr/bin/neezer-transcribe-v4
          cd "$GITHUB_WORKSPACE"
          NZ_WHISPER_MODEL="$RUNNER_TEMP/whisper/ggml-tiny.bin" \
          NZ_WHISPER_AUDIO="$RUNNER_TEMP/whisper/jfk.wav" \
            desktop/tools/check_cpu_floor.sh "$RUNNER_TEMP/arch-pkg/usr/bin/neezer-transcribe" \
            --no-ggml
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-arch-x86_64
          path: desktop/packaging/arch/neezer-desktop-[0-9]*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: desktop/packaging/arch/neezer-desktop-[0-9]*.pkg.tar.zst

  # ---- ONE release build, four packages ----------------------------------
  # `deb`, `rpm`, `appimage` and `flatpak` below are packaging jobs: they
  # download THIS artefact instead of compiling the workspace again (the Arch
  # job builds its own on purpose: `makepkg` on an Arch system, P1). The
  # binaries are built on ubuntu-24.04 because that is the oldest glibc the
  # stack builds against in practice: the deb declares the floor it measured
  # (`libc6 (>= 2.39)`), and Debian 13 / Ubuntu 24.04 are the oldest systems it
  # installs on.
  binaries:
    name: Desktop binaries (shared by the four packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # The system dependency list is the same one desktop.yaml uses (a fresh
      # Ubuntu has none of what GPUI, cpal's PipeWire host and whisper.cpp's
      # Vulkan backend need). Kept in one place per workflow, not shared: a
      # package that stops building here must be readable on its own.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev glslc \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev \
            libfontconfig-dev libfreetype-dev libglib2.0-dev libzstd-dev libssl-dev
      # whisper.cpp's CMake build needs the Vulkan HEADERS, not only the loader
      # (docs/agents/desktop.md, "Pitfalls found by building"): CMake's
      # FindVulkan reads VULKAN_SDK, and it must be set before the FIRST build.
      - name: Vulkan headers for whisper.cpp
        run: |
          curl -sSL -o "$RUNNER_TEMP/vk.tar.gz" \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.333.tar.gz
          mkdir -p "$RUNNER_TEMP/vk"
          tar xzf "$RUNNER_TEMP/vk.tar.gz" -C "$RUNNER_TEMP/vk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/vk/lib"
          ln -sf "$(ldconfig -p | awk '/libvulkan\.so\.1 /{print $NF; exit}')" \
            "$RUNNER_TEMP/vk/lib/libvulkan.so"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"
      # ggml is compiled with `-march=native` (its `GGML_NATIVE` default), so the
      # objects in `target/` belong to the CPU that produced them — and this cache
      # never looked at the CPU: run 44240162634 restored (`full match: false`, a
      # partial restore) an object built on a runner with AVX-512, and the engine
      # child died with `SIGILL (signal 4)` on the runner that got it. The
      # fingerprint is the model and the flags line, hashed: another runner model is
      # another cache, never a binary that traps.
      - name: The runner's CPU, as a cache key
        id: cpu
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
          flags="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr -s ' ' | sed 's/^ *//')"
          fingerprint="$(printf '%s|%s' "$model" "$flags" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "CPU: $model (empreinte $fingerprint)"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # IN THE PREFIX, not in `key:`: on an exact miss rust-cache falls back to a
          # broader prefix, and a `key:`-only name would still restore another CPU's —
          # or another ISA floor's — objects through that fallback. Both identities are
          # here: the runner's CPU (#329's fingerprint) and the floors the engine
          # children are built for (docs/agents/desktop.md, *The CPU floor*).
          prefix-key: v0-rust-cpu-${{ steps.cpu.outputs.fingerprint }}-ggml-x86-64-v2-v3-v4
          # THE SAME ENTRY AS `desktop.yaml`'s `build` job, which compiles exactly
          # this graph (same workspace, same `--release`, same two engine
          # children) and kept a second 1.35 GB copy of it. This is a cache-BUDGET
          # fix: the repository was at 30 entries for 16.9 GB against the 10 GB
          # GitHub allows, so the fleet lives in LRU eviction. rust-cache's
          # `shared-key` "is used instead of the automatic `job`-based key, and is
          # stable over multiple jobs", so the two workflows now write and read one
          # entry.
          shared-key: desktop-release
      - name: Build the two binaries
        run: cargo build --release --locked --workspace
      # The x86-64-v3 engine child, beside the floor one (docs/agents/desktop.md,
      # *The CPU floor, and the child that picks its own ISA*): a second build into
      # its own target, because cargo compiles one copy of a dependency per graph.
      # It is what gives a Haswell-class laptop 23.5× real time instead of 5×.
      - name: Build the x86-64-v3 and x86-64-v4 engine children
        run: tools/build_engine_variants.sh --release
      - name: Binary sizes
        run: |
          du -h target/release/neezer-desktop target/release/neezer-transcribe \
            target/release/neezer-transcribe-v3 target/release/neezer-transcribe-v4
      # WHAT IS SHIPPED, PROVEN ON WHAT IS SHIPPED. The artefact below is installed
      # by the .deb, the .rpm, the AppImage and the Flatpak on CPUs nobody chose,
      # and `-march=native` (ggml's default) is exactly a binary that SIGILLs on an
      # older one. `desktop/.cargo/config.toml` pins the floor; this runs the three
      # checks of `desktop/tools/check_cpu_floor.sh` on this exact file: the census,
      # ggml's own objects gated at x86-64-v2, and the binary itself transcribing
      # eleven real seconds of speech under an EMULATED x86-64-v2 CPU (Nehalem).
      - name: The CPU floor holds on the binary the packages ship
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-user
          mkdir -p "$RUNNER_TEMP/whisper"
          cd "$RUNNER_TEMP/whisper"
          test -f ggml-tiny.bin || curl -sSLo ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          test -f jfk.wav || curl -sSLo jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" \
            | sha256sum -c -
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" \
            | sha256sum -c -
          cd "$GITHUB_WORKSPACE/desktop"
          NZ_WHISPER_MODEL="$RUNNER_TEMP/whisper/ggml-tiny.bin" \
          NZ_WHISPER_AUDIO="$RUNNER_TEMP/whisper/jfk.wav" \
            tools/check_cpu_floor.sh target/release/neezer-transcribe
      - name: Upload the binaries every package installs
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-binaries-x86_64
          path: |
            desktop/target/release/neezer-desktop
            desktop/target/release/neezer-transcribe
            desktop/target/release/neezer-transcribe-v3
            desktop/target/release/neezer-transcribe-v4
          if-no-files-found: error
          retention-days: 7

  # The .deb is built AND installed in the distribution it targets: `apt-get
  # install ./file.deb` resolves the control file's `Depends:` from the archive,
  # so a dependency the package forgets is a job that fails here rather than an
  # app that does not start on a person's laptop. Then the window paints on a
  # display of the job's own (Xvfb) and the sidecar reports its Vulkan device.
  deb:
    name: Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: binaries
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install git (actions/checkout needs it)
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
        # NO `ref:` on purpose: the RECIPES come from the commit this workflow
        # runs at (`github.sha`), never from the tag. A release replay on an
        # older tag (workflow_dispatch -f tag=v1.6.0) must still be packaged by
        # the recipes that ran: v1.6.0 predates
        # `desktop/packaging/{deb,rpm,appimage,flatpak}` and all four jobs died
        # on `version.sh: No such file or directory` (run 44150836135). What
        # comes from the TAG: the version (`TAG` above) and the binaries (the
        # `binaries` job, which does build the tagged tree). A tag that carries
        # the recipes behaves identically, because then `github.sha` IS the tag.
      - name: The binaries every package is built from
        uses: actions/download-artifact@v4
        with:
          name: neezer-desktop-binaries-x86_64
          path: binaries
      # `upload-artifact`/`download-artifact` do not carry the executable bit
      # (measured: the binaries arrived 0644 and `lib.sh` refused them, in all
      # four jobs at once). One chmod here beats a package that cannot run its
      # own binaries.
      - name: Make the downloaded binaries executable
        run: chmod +x binaries/neezer-desktop binaries/neezer-transcribe binaries/neezer-transcribe-v3 binaries/neezer-transcribe-v4
      # `readelf` (binutils) is what lib.sh reads the binaries' NEEDED sonames
      # and their glibc floor with; `dpkg-deb` is part of dpkg, already here.
      - name: Build tooling
        run: apt-get install -y --no-install-recommends binutils >/dev/null
      - name: Build the package
        run: |
          set -euo pipefail
          version="$(desktop/packaging/version.sh)"
          NEEZER_DESKTOP_VERSION="$version" NEEZER_BINARY_DIR="$PWD/binaries" \
            desktop/packaging/deb/build.sh release
      - name: Install it and start the app (Xvfb, our own display)
        run: |
          set -euo pipefail
          desktop/packaging/deb/test.sh release/neezer-desktop-*-x86_64.deb
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-deb-x86_64
          path: release/neezer-desktop-*-x86_64.deb
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/neezer-desktop-*-x86_64.deb

  # Same shape in Fedora: `dnf install ./file.rpm` resolves the soname Requires
  # rpmbuild generated from the two binaries (libpipewire-0.3.so.0()(64bit),
  # libvulkan.so.1()(64bit), …), which is the RPM world's way of not listing
  # dependencies by hand.
  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: binaries
    container:
      image: fedora:latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install git (actions/checkout needs it)
        run: dnf install -y git ca-certificates >/dev/null
      - name: Checkout
        uses: actions/checkout@v4
        # NO `ref:` on purpose: the RECIPES come from the commit this workflow
        # runs at (`github.sha`), never from the tag. A release replay on an
        # older tag (workflow_dispatch -f tag=v1.6.0) must still be packaged by
        # the recipes that ran: v1.6.0 predates
        # `desktop/packaging/{deb,rpm,appimage,flatpak}` and all four jobs died
        # on `version.sh: No such file or directory` (run 44150836135). What
        # comes from the TAG: the version (`TAG` above) and the binaries (the
        # `binaries` job, which does build the tagged tree). A tag that carries
        # the recipes behaves identically, because then `github.sha` IS the tag.
      - name: The binaries every package is built from
        uses: actions/download-artifact@v4
        with:
          name: neezer-desktop-binaries-x86_64
          path: binaries
      # `upload-artifact`/`download-artifact` do not carry the executable bit
      # (measured: the binaries arrived 0644 and `lib.sh` refused them, in all
      # four jobs at once). One chmod here beats a package that cannot run its
      # own binaries.
      - name: Make the downloaded binaries executable
        run: chmod +x binaries/neezer-desktop binaries/neezer-transcribe binaries/neezer-transcribe-v3 binaries/neezer-transcribe-v4
      - name: Build tooling
        run: dnf install -y rpm-build binutils >/dev/null
      - name: Build the package
        run: |
          set -euo pipefail
          version="$(desktop/packaging/version.sh)"
          NEEZER_DESKTOP_VERSION="$version" NEEZER_BINARY_DIR="$PWD/binaries" \
            desktop/packaging/rpm/build.sh release
      - name: Install it and start the app (Xvfb, our own display)
        run: |
          set -euo pipefail
          desktop/packaging/rpm/test.sh release/neezer-desktop-*-x86_64.rpm
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-rpm-x86_64
          path: release/neezer-desktop-*-x86_64.rpm
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/neezer-desktop-*-x86_64.rpm

  # The AppImage runs on the runner itself: the file it produces is the file a
  # person double-clicks, so the job downloads it, starts it, and asks the
  # sidecar inside it for its version.
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: binaries
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # NO `ref:` on purpose: the RECIPES come from the commit this workflow
        # runs at (`github.sha`), never from the tag. A release replay on an
        # older tag (workflow_dispatch -f tag=v1.6.0) must still be packaged by
        # the recipes that ran: v1.6.0 predates
        # `desktop/packaging/{deb,rpm,appimage,flatpak}` and all four jobs died
        # on `version.sh: No such file or directory` (run 44150836135). What
        # comes from the TAG: the version (`TAG` above) and the binaries (the
        # `binaries` job, which does build the tagged tree). A tag that carries
        # the recipes behaves identically, because then `github.sha` IS the tag.
      - name: The binaries every package is built from
        uses: actions/download-artifact@v4
        with:
          name: neezer-desktop-binaries-x86_64
          path: binaries
      # `upload-artifact`/`download-artifact` do not carry the executable bit
      # (measured: the binaries arrived 0644 and `lib.sh` refused them, in all
      # four jobs at once). One chmod here beats a package that cannot run its
      # own binaries.
      - name: Make the downloaded binaries executable
        run: chmod +x binaries/neezer-desktop binaries/neezer-transcribe binaries/neezer-transcribe-v3 binaries/neezer-transcribe-v4
      # What the AppImage expects to find on the host, because it bundles none of
      # it: the graphics stack, PipeWire/ALSA, the Vulkan loader and a Vulkan
      # device (lavapipe on a runner), plus Xvfb for a display of our own.
      - name: The desktop the AppImage relies on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libpipewire-0.3-0t64 libasound2t64 libvulkan1 mesa-vulkan-drivers \
            xvfb xauth
      - name: Build the AppImage
        run: |
          set -euo pipefail
          version="$(desktop/packaging/version.sh)"
          mkdir -p release
          NEEZER_DESKTOP_VERSION="$version" NEEZER_BINARY_DIR="$PWD/binaries" \
            desktop/packaging/appimage/build.sh release
      - name: Run it (its own display, then the sidecar inside it)
        run: |
          set -euo pipefail
          desktop/packaging/appimage/test.sh release/neezer-desktop-*-x86_64.AppImage
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-appimage-x86_64
          path: release/neezer-desktop-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/neezer-desktop-*-x86_64.AppImage

  # The Flatpak job is the one that does NOT run in a container: flatpak-builder
  # builds inside bubblewrap, and nesting that needs `--privileged`, which a
  # container job cannot have. On the runner's own kernel it is an ordinary
  # unprivileged build.
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: binaries
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # NO `ref:` on purpose: the RECIPES come from the commit this workflow
        # runs at (`github.sha`), never from the tag. A release replay on an
        # older tag (workflow_dispatch -f tag=v1.6.0) must still be packaged by
        # the recipes that ran: v1.6.0 predates
        # `desktop/packaging/{deb,rpm,appimage,flatpak}` and all four jobs died
        # on `version.sh: No such file or directory` (run 44150836135). What
        # comes from the TAG: the version (`TAG` above) and the binaries (the
        # `binaries` job, which does build the tagged tree). A tag that carries
        # the recipes behaves identically, because then `github.sha` IS the tag.
      - name: The binaries every package is built from
        uses: actions/download-artifact@v4
        with:
          name: neezer-desktop-binaries-x86_64
          path: binaries
      # `upload-artifact`/`download-artifact` do not carry the executable bit
      # (measured: the binaries arrived 0644 and `lib.sh` refused them, in all
      # four jobs at once). One chmod here beats a package that cannot run its
      # own binaries.
      - name: Make the downloaded binaries executable
        run: chmod +x binaries/neezer-desktop binaries/neezer-transcribe binaries/neezer-transcribe-v3 binaries/neezer-transcribe-v4
      - name: flatpak and the runtime it is built against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder xvfb xauth binutils
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          # The manifest pins org.freedesktop.Platform//25.08 (flatpak/), and
          # `GL.default` is the extension that carries Mesa: the Vulkan ICDs the
          # app's GPU surface and whisper's backend need on a runner with no
          # driver of its own. Installed explicitly, never left to whatever
          # `flatpak install` decides to bring along.
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform.GL.default//25.08
      - name: Build the bundle
        run: |
          set -euo pipefail
          version="$(desktop/packaging/version.sh)"
          mkdir -p release
          NEEZER_DESKTOP_VERSION="$version" NEEZER_BINARY_DIR="$PWD/binaries" \
            desktop/packaging/flatpak/build.sh release
      - name: Install it for a user and start it (Xvfb, our own display)
        run: |
          set -euo pipefail
          NEEZER_FLATPAK_UNINSTALL=1 \
            desktop/packaging/flatpak/test.sh release/neezer-desktop-*-x86_64.flatpak
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: neezer-desktop-flatpak-x86_64
          path: release/neezer-desktop-*-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release/neezer-desktop-*-x86_64.flatpak
