name: Android

# Builds the native Android app (android/) into a downloadable APK, in
# parallel with the Docker image workflow. The APK is uploaded as a run
# artifact on every build, and attached to the GitHub release on v* tags.
#
# Signing: without secrets, an ephemeral keystore is generated per run —
# installing a newer build then requires uninstalling the previous one
# (signature mismatch). For a stable signature, set the repo secrets
# ANDROID_KEYSTORE_BASE64 (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - android/**
      - webapp/rhythm/**
      - .github/workflows/android.yaml
  pull_request:
    paths:
      - android/**
      - webapp/rhythm/**
      - .github/workflows/android.yaml
  workflow_dispatch:

# A newer push to the same pull request makes the running build pointless — and
# this workflow had no guard at all, so a superseded run kept a runner for its
# whole 2.8-5.5 min (8 successful runs) to publish an APK nobody would take.
# Pull requests only: a `v*` tag's run is the APK a release ships, and a
# `master` run is the commit the next release is cut from. Both go to the end.
#
# The other short workflows need nothing more: `tests.yaml`, `webapp.yaml`,
# `docker.yaml` and `security.yaml` already carry this exact guard (3.1, 3.2,
# 2.2 and 1.3-2.0 min, each already at the cost of its own suite), and
# `network.yaml` is a weekly cron with no push to supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    # Bounded in time, like mobile's apk (measured max 29.7 min there): this job
    # is the other workflow that had no ceiling at all.
    timeout-minutes: 45
    permissions:
      contents: write # attach the APK to releases on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The native audio core (android/nscore): its own tests, then the same
      # library on the host held to rhythm.wasm frame for frame through its real
      # JNI entry points, then the three device ABIs packed into the APK.
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Native core tests
        run: |
          (cd webapp && npm ci --no-audit --no-fund)
          cd android/nscore
          cargo test --release
          cargo build --release
          node test/compare.mjs

      - name: Build the native core for Android
        run: android/nscore/build-android.sh

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$GITHUB_WORKSPACE/android/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            # Alias/password defaults stay `nsupysonic`: an operator-supplied
            # keystore may have been created with that alias, and a different
            # one would simply fail to sign. It is a key identity, not a brand.
            keytool -genkeypair -keystore "$KS" -alias nsupysonic \
              -storepass nsupysonic -keypass nsupysonic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Neezer"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-nsupysonic}"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-nsupysonic}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-nsupysonic}"
          } >> "$GITHUB_ENV"

      # RangeBody's contract with the WebView's own range handling (a download
      # served to the page's <audio> element), on the JVM.
      # Each Gradle invocation below resolves its own dependencies from Maven
      # Central, so each gets the 429-only retry loop `mobile.yaml` already runs
      # (a runner shares its IP with the fleet; Robolectric's cold runtime
      # download and `kotlin-reflect` both answered 429 here). The loop retries
      # THE SAME invocation only when the log carries that 429, never a test,
      # lint or compile failure; the tasks and flags are unchanged.
      - name: Unit tests
        run: |
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            log="$RUNNER_TEMP/gradle-android-unit-$attempts.log"
            if gradle -p android testReleaseUnitTest 2>&1 | tee "$log"; then
              break
            fi
            if (( attempts >= 3 )) || ! grep -q "status code 429" "$log"; then
              exit 1
            fi
            echo "::warning::Maven Central rate-limited a dependency download; retry $attempts/3 in 60 s"
            sleep 60
          done

      - name: Lint
        run: |
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            log="$RUNNER_TEMP/gradle-android-lint-$attempts.log"
            if gradle -p android lintDebug 2>&1 | tee "$log"; then
              break
            fi
            if (( attempts >= 3 )) || ! grep -q "status code 429" "$log"; then
              exit 1
            fi
            echo "::warning::Maven Central rate-limited a dependency download; retry $attempts/3 in 60 s"
            sleep 60
          done

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            log="$RUNNER_TEMP/gradle-android-assemble-$attempts.log"
            if gradle -p android assembleRelease 2>&1 | tee "$log"; then
              break
            fi
            if (( attempts >= 3 )) || ! grep -q "status code 429" "$log"; then
              exit 1
            fi
            echo "::warning::Maven Central rate-limited a dependency download; retry $attempts/3 in 60 s"
            sleep 60
          done

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk neezer.apk

      - name: Verify the APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?no Android SDK}}"
          BT="$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BT" ]; then
            echo "no build-tools under $SDK" >&2
            exit 1
          fi
          size=$(stat -c%s neezer.apk)
          echo "neezer.apk: $size bytes"
          if [ "$size" -le 1000000 ]; then
            echo "neezer.apk is $size bytes: too small to be an APK" >&2
            exit 1
          fi
          if ! unzip -t neezer.apk > unzip-test.txt; then
            tail -5 unzip-test.txt
            echo "neezer.apk is not a readable zip: truncated or corrupt" >&2
            exit 1
          fi
          tail -1 unzip-test.txt
          if ! out=$("${BT}apksigner" verify --min-sdk-version 23 --verbose --print-certs neezer.apk 2>&1); then
            echo "$out"
            echo "apksigner verify failed: the APK is not installable" >&2
            exit 1
          fi
          echo "$out" | grep -v "not protected by signature" || true
          for scheme in "v1 scheme" "v2 scheme" "v3 scheme"; do
            if ! echo "$out" | grep -q "^Verified using $scheme .*: true$"; then
              echo "signed with no $scheme" >&2
              exit 1
            fi
          done
          if ! "${BT}zipalign" -c -p 4 neezer.apk > /dev/null; then
            "${BT}zipalign" -c -p -v 4 neezer.apk | grep -v " (OK" | head -5 || true
            echo "neezer.apk is not 4-byte aligned" >&2
            exit 1
          fi
          "${BT}aapt2" dump badging neezer.apk > apk-badging.txt
          head -1 apk-badging.txt
          if ! grep -q "^package: name='org.nsupysonic.app' " apk-badging.txt; then
            echo "not the Neezer package" >&2
            exit 1
          fi
          versionCode=$(sed -n "s/^package: name='[^']*' versionCode='\([0-9][0-9]*\)'.*/\1/p" apk-badging.txt)
          if [ -z "$versionCode" ] || [ "$versionCode" -le 0 ]; then
            echo "versionCode '${versionCode}' is not positive" >&2
            exit 1
          fi
          echo "verified: org.nsupysonic.app versionCode $versionCode"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neezer-apk
          path: neezer.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: neezer.apk

      - name: Verify the release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if echo "$names" | grep -qx neezer.apk; then break; fi
            sleep 5
          done
          echo "$names"
          if ! echo "$names" | grep -qx neezer.apk; then
            echo "neezer.apk is not attached to $TAG" >&2
            exit 1
          fi
          if echo "$names" | grep -qx nsupysonic.apk; then
            echo "$TAG still carries nsupysonic.apk" >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/asset" && mkdir -p "$RUNNER_TEMP/asset"
          gh release download "$TAG" --pattern neezer.apk --dir "$RUNNER_TEMP/asset"
          cmp neezer.apk "$RUNNER_TEMP/asset/neezer.apk"
          size=$(stat -c%s "$RUNNER_TEMP/asset/neezer.apk")
          [ "$size" -gt 1000000 ]
          echo "release asset $TAG/neezer.apk: $size bytes, sha256 $(sha256sum "$RUNNER_TEMP/asset/neezer.apk" | cut -d' ' -f1)"

  # --- the release APK, installed and driven -------------------------------
  # The `apk` job proves the FILE: an archive, a signature, alignment, a package
  # id. It never INSTALLED it, so a crash at the first Activity shipped on a
  # green run (the class the mobile app shipped twice in v1.6.5 / v1.6.6). This
  # job boots the same headless AVD the native app uses, installs the published
  # release APK, and drives its first user path: setup screen -> enter the
  # server -> « Se connecter » -> MainActivity -> the WebView fetches the SPA,
  # proved by a bundle request in the server's own log, with an empty crash
  # buffer. `android/tools/ci-emulator.sh` is the driver; the emulator lifecycle
  # is `mobile/tools/emu.sh` (one set of flags, tested).
  emulator:
    name: Emulator smoke (WebView APK, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The documented recipe: /dev/kvm must be readable by the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `sdkmanager`/`avdmanager` are Java programs, hence the JDK before them.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image carries `adb` but NOT the emulator package, and
      # `emu.sh create` refuses an SDK without `emulator/emulator` before it
      # reaches its own install branch (measured on this job's first run: 1m10s,
      # "emulator not found at /usr/local/lib/android/sdk/emulator/emulator").
      # Same recipe as `mobile.yaml`; `emu.sh create` then only makes the AVD.
      - name: Install the emulator and its system image
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          # `yes | sdkmanager --licenses` fails the step under `pipefail` when
          # sdkmanager has nothing left to ask and closes the pipe first
          # (measured on mobile.yaml's emulator job, 2026-11-17): the licences
          # are what we want, not yes's exit status.
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-35;default;x86_64"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server the smoke drives
        run: pip install -e .

      # The SPA the WebView loads lives in `neezer/webui/dist`, which a fresh
      # checkout does not carry: `perf_api.py` serves `/app/` from it.
      #
      # `webapp/src/lib/measure/measure.wasm` is gitignored, and `npm run
      # build` imports it (`src/lib/analysis/client.js`): without it the build
      # fails — on `version.json`'s ENOENT first, which hid the missing module.
      # Built here by the same recipe as `webapp.yaml` and the Dockerfile.
      - name: Set up Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Build the SPA the WebView will load
        working-directory: webapp
        run: |
          npm ci --no-audit --no-fund
          node measure/build.mjs
          npm run build

      - uses: actions/download-artifact@v4
        with:
          name: neezer-apk
          path: .

      # `--/app/` must answer 200 for the connect probe and the WebView; the
      # library is the smallest that logs in, not a measure.
      - name: Start the bench server
        id: server
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/android-server.log"
          setsid python tools/perf_api.py --runs 1 --serve \
            --tracks 200 --playlists 1 --favorites 5 >"$log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/android-server.pid"
          for _ in $(seq 1 180); do
            ready="$(grep -m1 -E '^READY [0-9]+ ' "$log" || true)"
            [ -n "$ready" ] && break
            kill -0 "$(cat "$RUNNER_TEMP/android-server.pid")" 2>/dev/null \
              || { echo "::error::the bench server exited while starting"; tail -n 30 "$log"; exit 1; }
            sleep 1
          done
          [ -n "$ready" ] || { echo "::error::the bench server never printed READY"; tail -n 30 "$log"; exit 1; }
          port="$(awk '{print $2}' <<<"$ready")"
          echo "server_log=$log" >> "$GITHUB_OUTPUT"
          echo "server_port=$port" >> "$GITHUB_OUTPUT"
          echo "bench server on 10.0.2.2:$port (host 127.0.0.1:$port)"

      - name: The release APK installs and walks its first user path
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          SERVER_LOG: ${{ steps.server.outputs.server_log }}
          SERVER_PORT: ${{ steps.server.outputs.server_port }}
        run: |
          android/tools/ci-emulator.sh --apk neezer.apk \
            --server-log "$SERVER_LOG" --server-port "$SERVER_PORT"

      - name: Stop the bench server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/android-server.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/android-server.pid")" 2>/dev/null || true
          fi
