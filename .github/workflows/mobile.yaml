name: Mobile

# The native Android app (`mobile/`): the Rust core and its UniFFI surface, the
# Gradle tree that packages it, and — once MQ1 writes the harness — the headless
# emulator job (docs/agents/mobile.md, MB0).
#
# Paths: the app itself, the shared crates it compiles (a change in `nz-audio` or
# `nz-api` can break the phone build), the two web-app crates it links natively,
# the JNI core `nz-audio` uses, and this file.
#
# ATTACHED to releases since v1.6.3, UNDER ITS OWN NAMES: `neezer-native.apk`
# (universal) and `neezer-native-<abi>.apk`. The WebView app keeps
# `neezer.apk` and `android.yaml` untouched: the two apps coexist on a device
# and update from two channels (docs/agents/mobile.md, "Deux apps Android").

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - mobile/**
      - desktop/crates/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - webapp/measure/**
      - webapp/trainer/**
      - android/nscore/**
      - .github/workflows/mobile.yaml
  pull_request:
    paths:
      - mobile/**
      - desktop/crates/**
      - webapp/rhythm/**
      - webapp/appcore/**
      - webapp/measure/**
      - webapp/trainer/**
      - android/nscore/**
      - .github/workflows/mobile.yaml
  workflow_dispatch:

concurrency:
  # PULL REQUESTS ONLY, like every other workflow here (`tests.yaml`,
  # `webapp.yaml`, `desktop.yaml`, `security.yaml`). It used to be
  # `cancel-in-progress: true` for every event, which also killed a run of
  # `master` — and a cancelled run never reaches its cache's post-save step, so
  # the cargo cache the next run needed was simply absent: run 44278965693
  # logged "Cache not found for input keys: mobile-apk-…" and rebuilt 8 min of
  # Rust cold. A push to `master` is the commit a release comes from: it runs to
  # the end. (The cache itself is a separate problem — the repository's cache
  # budget, not this file; see the PR.)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "4"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 30.0.16248370
  # WHICH ABIs a run builds, space-separated (allowed: arm64-v8a armeabi-v7a
  # x86_64; unset = all three, so a local `mobile/rust/build-android.sh` and a
  # Gradle build off CI are unchanged).
  #
  # A PULL REQUEST BUILDS x86_64 ALONE — the emulator's own ABI, which is the
  # only one a PR run ever loads. Measured (run 45366701201): `cargo ndk` is
  # 503 s of the native build's 566 s, i.e. ~168 s per ABI, so a PR saves about
  # two thirds of the one step that dominates it. `master`, a `v*` tag and a
  # manual dispatch keep all three: a compiler error specific to ARM (NEON,
  # `cfg(target_arch)`) must be seen before a release, never after it (owner
  # decision 2026-11-24: "pour les tests oui, mais en release il faut tout
  # build").
  NZ_ABIS: ${{ github.event_name == 'pull_request' && 'x86_64' || 'arm64-v8a armeabi-v7a x86_64' }}

jobs:
  # --- the Rust workspace on the host ---------------------------------------
  # Everything the app decides is proven HERE (docs/agents/mobile.md, "Tests and
  # emulation"): the core's logic, the FFI conversions, the lists, the error
  # sentences. The desktop workflow proves the shared crates.
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    # Bounded in time: measured median 331 s, p90 373 s (6.2 min).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache the cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: mobile-cargo-${{ hashFiles('mobile/rust/Cargo.lock', 'desktop/Cargo.lock') }}
          restore-keys: mobile-cargo-

      # NOT `cargo fmt --all`: that also formats the crates this workspace
      # reaches by PATH (webapp/rhythm, android/nscore, desktop/crates/*), and
      # reformatting those would be this lot editing another area's files —
      # measured: 39 files and 2 189 lines of a stranger's code.
      - name: Format
        working-directory: mobile/rust
        run: >
          cargo fmt
          -p nz-core -p nz-ffi -p nz-droid-audio -p nz-viz-gl -p nz-bindgen
          --check

      - name: Clippy (warnings are errors)
        working-directory: mobile/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: mobile/rust
        run: cargo test --workspace --locked

  # --- the APK ---------------------------------------------------------------
  apk:
    name: APK (bindings, Gradle, lint, sizes)
    runs-on: ubuntu-latest
    # Bounded in time: this job measured max 29.7 min and p90 24.9 min; the worst
    # run of the sample lasted 165 min overall (run 45253172024, two attempts).
    timeout-minutes: 45
    permissions:
      contents: write # attach the native APKs to releases on tags
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.7"

      - name: Set up Rust and the Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      # THE PRODUCTS OF THE RUST BUILD, CACHED BY THE HASH OF EVERY RUST INPUT.
      #
      # Measured on run 44368850444: `Build libnz_ffi.so and the Kotlin bindings`
      # takes 9.53 min on a cold cache and 9.97 on a "warm" one, because a
      # `target/` cache cannot help a fresh checkout: cargo's fingerprint for a
      # crate under a PATH dependency is a mtime, and `actions/checkout` gives
      # every file a new one, so all eleven `nz-*` crates, `appcore` and `rhythm`
      # are rebuilt at every run while only the registry dependencies come back.
      #
      # So the build is cached where it actually ends: its two outputs — the
      # `libnz_ffi.so` of every ABI in `NZ_ABIS` and the generated UniFFI
      # Kotlin — under a key that hashes every input of the build (`mobile/rust/**`,
      # its three path-dependency trees, its toolchain and its config). A
      # Kotlin-only or docs-only change hits it and the step is skipped entirely;
      # a Rust change misses it and builds, which is the only honest answer.
      #
      # THE KEY CARRIES THE ABI SET, because the product now depends on it: a
      # pull request builds x86_64 alone (`env.NZ_ABIS`), so without the
      # discriminator a 3-ABI entry saved by `master` would be restored by a PR
      # run and the ARM libraries it never built would silently be the cached
      # ones. `hashFiles` cannot see an env var, hence the literal `x86_64`/`all`.
      #
      # NO `restore-keys` HERE, deliberately: a product is never partially
      # reusable. Restoring the `.so` of another source tree would ship that tree.
      # 20.8 MB compressed against 1.36 GB for `target/`.
      #
      # It runs BEFORE the `target/` restore because `hashFiles` must not see a
      # restored `mobile/rust/target` (the key would change with the cache's
      # contents).
      - name: Restore the native library and the bindings
        id: native
        uses: actions/cache@v4
        with:
          path: |
            mobile/android/bridge/src/main/jniLibs
            mobile/android/bridge/build/generated/uniffi
          key: mobile-native-${{ github.event_name == 'pull_request' && 'x86_64' || 'all' }}-${{ hashFiles(
            'mobile/rust/Cargo.toml',
            'mobile/rust/Cargo.lock',
            'mobile/rust/uniffi.toml',
            'mobile/rust/rust-toolchain.toml',
            'mobile/rust/build-android.sh',
            'mobile/rust/crates/**',
            'mobile/rust/bindgen/**',
            'desktop/crates/**',
            'webapp/appcore/**',
            'webapp/rhythm/**'
            ) }}

      - name: Cache the cargo registry, binaries and target dir
        uses: actions/cache/restore@v4
        id: cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            mobile/rust/target
          key: mobile-apk-${{ hashFiles('mobile/rust/Cargo.lock', 'desktop/Cargo.lock') }}
          restore-keys: mobile-apk-

      # The platform/tools the Gradle build compiles and signs with. Pinned, so a
      # runner image change cannot move them under a build.
      - name: Install the SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The NDK is for `cargo ndk` alone, so it is installed only when the Rust
      # build will actually run: on a cached build there is nothing to link.
      - name: Install the NDK (only when the Rust build will run)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      # Idempotent on purpose: the job caches `~/.cargo/bin`, so the second run
      # finds the binary and `cargo install` refuses ("binary `cargo-ndk` already
      # exists in destination", exit 101) — measured on this very PR.
      - name: Install cargo-ndk (only when the Rust build will run)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cargo ndk --version 2>/dev/null || cargo install cargo-ndk --locked --version 4.1.2
          cargo ndk --version

      # The one documented native build: host debug library → UniFFI bindings →
      # cargo ndk for every ABI in `NZ_ABIS` (x86_64 alone on a PR, all three
      # elsewhere; docs/agents/mobile.md, MB0 "Contract"). Skipped when no Rust
      # input changed (`steps.native`).
      - name: Build libnz_ffi.so and the Kotlin bindings
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          time mobile/rust/build-android.sh

      # A cached product is only as good as the guard that accepts it: the same
      # `--check-libs` (a `NEEDED` the APK does not carry is an app that dies at
      # `System.loadLibrary`) runs on what came out of the cache, on every run.
      - name: The cached native library still holds (no Rust change)
        if: steps.native.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          echo "native=from cache (no Rust input changed since the cached build)"
          mobile/rust/build-android.sh --check-libs \
            "$GITHUB_WORKSPACE/mobile/android/bridge/src/main/jniLibs"
          for abi in $NZ_ABIS; do
            so="mobile/android/bridge/src/main/jniLibs/$abi/libnz_ffi.so"
            test -f "$so" || { echo "::error::$so is missing from the cache"; exit 1; }
            printf '   %-12s %8s bytes\n' "$abi" "$(stat -c %s "$so")"
          done
          test "$(find mobile/android/bridge/build/generated/uniffi -name '*.kt' | wc -l)" -gt 0

      # `AudioTrackPull.kt` (the API-26 output, lot MB3a) reaches its natives by
      # NAME (`System.loadLibrary` + `external fun`), so nothing calls them from
      # Rust and a linker that garbage-collects unreferenced sections is free to
      # drop them from the cdylib without failing the build: measured, a cdylib
      # that only depends on `nz-droid-audio` exports 0 of the 4. `nz-ffi` keeps
      # them through a `#[used]` reference; this is the check that it still does,
      # on the library the APK really ships.
      - name: The API-26 JNI entry points are in libnz_ffi.so
        run: |
          set -euo pipefail
          # The FIRST ABI of the run's set: an export list is a property of the
          # Rust source, not of an architecture, so one library answers for all
          # of them — and on a PR that library is x86_64 (the only one built).
          read -r first _ <<< "$NZ_ABIS"
          SO=mobile/android/bridge/src/main/jniLibs/$first/libnz_ffi.so
          test -f "$SO" || { echo "::error::$SO is missing"; exit 1; }
          for name in nativeRender nativeSetLatency nativeUnderruns nativeClose; do
            symbol="Java_fr_neezer_mobile_playback_AudioTrackPull_$name"
            line=$(nm -D --defined-only "$SO" | grep -E " T $symbol$" || true)
            case "$line" in
              *"$symbol"*) printf '   %s\n' "$symbol" ;;
              *) echo "::error::$symbol is not exported by libnz_ffi.so"; exit 1 ;;
            esac
          done

      # THE NATIVE LIBRARY AND THE KOTLIN BINDINGS, HANDED TO THE `emulator` JOB.
      #
      # Measured on run 44368850444: that job's `Smoke` spent 12 min 30 s
      # (18:48:36 → 19:01:03) recompiling the whole Rust tree from cold — it had
      # neither the `.so` nor the bindings this job had just built — while the
      # emulator's four vCPUs sat waiting, then ~2 min recompiling the Kotlin
      # debug variants. The two paths below are what `build-android.sh` produces
      # (`jniLibs` for every ABI of `NZ_ABIS`, the UniFFI Kotlin), and `-PskipRust` is
      # the property `:bridge`'s build script already has for exactly this.
      #
      # 27 MB, one upload and one download: a 12-minute build it removes.
      - name: Upload the native library and the bindings
        uses: actions/upload-artifact@v4
        with:
          name: neezer-mobile-native
          path: |
            mobile/android/bridge/src/main/jniLibs
            mobile/android/bridge/build/generated/uniffi
          if-no-files-found: error
          retention-days: 7

      # THE SAME RELEASE KEY AS THE WEBVIEW APP (`android.yaml`'s secrets), and
      # for the same reason: a native build signed with the debug key cannot be
      # updated in place, and a per-run key cannot either. A different
      # `applicationId` does not need a different certificate; it needs a STABLE
      # one, and the secrets are the only place a stable one lives.
      #
      # A pull request keeps the old fallback (an ephemeral key, generated here)
      # so a fork without the secrets can still build and test. A TAG may not:
      # the check below refuses a release signed with anything but the stable
      # key.
      - name: Prepare the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/neezer-mobile-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is required to sign a release: a tag's APK must update the previous one"
              exit 1
            fi
            echo "::warning::no ANDROID_KEYSTORE_BASE64: this is a TEST build signed with an ephemeral key"
            keytool -genkeypair -keystore "$KS" -alias nsupysonic \
              -storepass nsupysonic -keypass nsupysonic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Neezer"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-nsupysonic}"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-nsupysonic}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-nsupysonic}"
          } >> "$GITHUB_ENV"

      # THREE TASKS, ONE GRADLE INVOCATION. `--no-daemon` pays a JVM plus the
      # whole configuration phase (Kotlin + AGP) on every call, and the three
      # steps were paying it three times: measured on run 44368850444, JVM tests
      # 3.52 min + lint 2.38 + assemble 4.23 = 10.13 min of Gradle for one build
      # graph. The tasks, their order and their failure semantics are unchanged:
      # `assembleRelease` alone only runs `lintVitalRelease`, which ignores an
      # error-level check (the old app's lesson, android.yaml), so the full
      # `lintDebug` is still asked for explicitly, and a red test or lint error
      # still stops the job before an APK exists.
      #
      # The versionName is the TAG (Gradle strips its `v`), which is what the
      # server declares in `android.native.version`; a master build names its run.
      - name: The JVM suite, the lint and the release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('2.0.{0}', github.run_number) }}
        run: |
          # A runner shares its IP with the fleet, and Maven Central answers
          # `429 Too Many Requests` to a cold Robolectric runtime download
          # (measured twice on 2026-11-24, `nativeruntime-dist-compat`). That is
          # not a red test: retry THE SAME invocation only when the log carries
          # that 429, never for a test, lint or compile failure.
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            log="$RUNNER_TEMP/gradle-mobile-$attempts.log"
            if gradle -p mobile/android testDebugUnitTest lintDebug assembleRelease \
                -PskipRust --no-daemon 2>&1 | tee "$log"; then
              break
            fi
            if (( attempts >= 3 )) || ! grep -q "status code 429" "$log"; then
              exit 1
            fi
            echo "::warning::Maven Central rate-limited a dependency download; retry $attempts/3 in 60 s"
            sleep 60
          done
          find mobile/android/app/build/outputs/apk -name '*.apk'

      # THE PLATFORM TLS VERIFIER SURVIVES R8, on the minified build ONLY.
      #
      # `rustls-platform-verifier`'s Android half reaches
      # `org.rustls.platformverifier.CertificateVerifier` through JNI by NAME, so
      # R8 cannot see the edge and a release that lacks the keep rule ships a
      # verifier that is stripped or renamed: every system-trust handshake then
      # fails, and the app says the server is offline (measured on v1.6.5, whose
      # debug builds and unminified emulator smoke were green throughout).
      #
      # R8's mapping is where the truth is: an untouched class appears as
      # `X -> X:` (a renamed one as `X -> a.b.c:`), and a stripped one not at
      # all. Run once WITHOUT the rule in `:bridge/consumer-rules.pro` and this
      # check fails on all three classes — "R8 dropped or renamed …", plus the
      # mapping's own (absent) lines — which is the regression it exists for. The
      # emulator job's `ReleaseTlsTrustTest` proves the same edge on a device.
      - name: The platform TLS verifier survives R8
        run: |
          set -euo pipefail
          mapping=mobile/android/app/build/outputs/mapping/release/mapping.txt
          test -f "$mapping" || { echo "::error::$mapping is missing (was assembleRelease minified?)"; exit 1; }
          for class in \
            org.rustls.platformverifier.CertificateVerifier \
            org.rustls.platformverifier.StatusCode \
            org.rustls.platformverifier.VerificationResult; do
            want="$class -> $class:"
            if ! grep -qxF -- "$want" "$mapping"; then
              echo "::error::R8 dropped or renamed $class: the platform TLS verifier is unreachable from JNI"
              grep -n "org.rustls.platformverifier" "$mapping" || echo "   (no org.rustls.platformverifier line at all)"
              echo "   the rule is in mobile/android/bridge/consumer-rules.pro (rustls-platform-verifier README, 'Proguard')"
              exit 1
            fi
            printf '   kept unchanged: %s\n' "$class"
          done

      # An APK that cannot be proven is not published: a truncated archive opens
      # as "not a valid application", and a v2-only signature cannot update a
      # device signed with v1 (measured on the old app's v1.3.1). `--min-sdk-version
      # 23` is what makes apksigner check the JAR signature at all.
      #
      # EVERY APK is proven, not just the first: since « MQ2 — la taille » the
      # `apk` job emits one APK per ABI plus the universal one, and a split whose
      # signature or alignment is wrong is an app that installs nowhere.
      - name: Verify the APK
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          shopt -s nullglob
          apks=(mobile/android/app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "::error::no release APK was built"; exit 1; }
          for APK in "${apks[@]}"; do
            echo "== $APK ($(stat -c %s "$APK") bytes)"
            unzip -t "$APK" > /dev/null
            "$BT/apksigner" verify --min-sdk-version 23 --verbose --print-certs "$APK" | tee /tmp/verify.txt
            # `--verbose` is what MAKES apksigner print the three scheme lines at
            # all (without it, `apksigner verify` prints nothing but "Verifies"),
            # and the line carries the scheme's full name in parentheses
            # (`Verified using v1 scheme (JAR signing): true`), so the check asks
            # for the prefix and then for `true` — a literal "v1 scheme: true"
            # never matches, which is how a correct APK failed this very check.
            for scheme in v1 v2 v3; do
              line=$(grep -i "Verified using $scheme scheme" /tmp/verify.txt || true)
              case "$line" in
                *true*) ;;
                *) echo "::error::$scheme signature missing in $APK ($line)"; exit 1 ;;
              esac
            done
            "$BT/zipalign" -c -p 4 "$APK"
            # THE NATIVE PACKAGE, beside `org.nsupysonic.app`: a build that
            # drifted back to the old id would install as an update OF the
            # WebView app, which is exactly what this release must not do.
            "$BT/aapt2" dump badging "$APK" | grep -E "package: name='fr.neezer.mobile'" \
              || { echo "::error::wrong package id in $APK"; exit 1; }
            # A tag's APK must update the PREVIOUS tag's: the debug key cannot,
            # and neither can an ephemeral one. The fallback is for pull
            # requests only (the keystore step refuses a tag without the secret).
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              signer=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate DN:' || true)
              case "$signer" in
                *"CN=Android Debug"*) echo "::error::$APK is signed with the debug key"; exit 1 ;;
                "") echo "::error::$APK has no readable signer"; exit 1 ;;
              esac
              echo "   signed by: ${signer#*DN: }"
            fi
          done
          # The universal APK is the one that installs on ANY device (the app is
          # side-loaded), so it is the artifact the emulator job and the release
          # read. Every split shares its versionCode — checked here because the
          # updater refuses a code that is not higher than the one installed.
          UNIVERSAL=mobile/android/app/build/outputs/apk/release/app-universal-release.apk
          APK="$UNIVERSAL"
          echo "APK=$APK" >> "$GITHUB_ENV"
          codes=$("$BT/aapt2" dump badging "${apks[@]}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | sort -u)
          [[ "$(printf '%s\n' "$codes" | wc -l)" -eq 1 ]] \
            || { echo "::error::the APKs disagree on versionCode: $codes"; exit 1; }

      # THE CLASS R8 IS TOLD TO KEEP IS IN THE APK A PERSON INSTALLS.
      #
      # The mapping guard above proves R8's CONFIG kept it; this proves the dex
      # that ships actually carries it, which is the fact the JNI call needs (a
      # rule that names a class the dependency no longer has would pass the
      # mapping check and still fail on a phone). Read from the UNIVERSAL APK —
      # the one `ci-emulator.sh` installs and the release page serves — through
      # the dex string table, one `grep -F` on the descriptor the JVM resolves.
      # Run once against a build without :bridge's rule and there is no such
      # string at all (measured on this PR, `v1.6.5`).
      - name: The shipped APK carries the platform TLS verifier
        run: |
          set -euo pipefail
          descriptor='Lorg/rustls/platformverifier/CertificateVerifier;'
          if ! unzip -p "$APK" 'classes*.dex' | strings | grep -qF -- "$descriptor"; then
            echo "::error::$APK carries no $descriptor: the platform TLS verifier is not in the app"
            exit 1
          fi
          echo "   found $descriptor in $(basename "$APK") ($(stat -c %s "$APK") bytes)"

      # THE RELEASE ASSETS' OWN NAMES. `neezer.apk` belongs to the WebView app
      # (android.yaml): a native asset must never be called that, and a person
      # downloading from the release page must see which app each file is.
      - name: Name the native assets
        run: |
          set -euo pipefail
          out=mobile/android/app/build/outputs/apk/release
          cp "$out/app-universal-release.apk" "$out/neezer-native.apk"
          for abi in $NZ_ABIS; do
            cp "$out/app-$abi-release.apk" "$out/neezer-native-$abi.apk"
          done
          ls -l "$out"/neezer-native*.apk

      - name: Sizes (universal APK, per ABI, and the native library)
        run: |
          set -euo pipefail
          echo "### Tailles" >> "$GITHUB_STEP_SUMMARY"
          printf '| ce qui | octets |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for apk in mobile/android/app/build/outputs/apk/release/app-*.apk; do
            printf '| %s | %s |\n' "$(basename "$apk")" "$(stat -c %s "$apk")" >> "$GITHUB_STEP_SUMMARY"
          done
          unzip -l "$APK" | awk '/lib\/.*\/libnz_ffi\.so/ {printf "| %s | %s |\n", $4, $1}' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # THE CEILING (lot « MQ2 — la taille »). The library doubled between MB3a
      # (9,2 MB) and MQ2 (19,8 MB) without a single red check: it compiled, it
      # played, and the only symptom was a download nobody measured. Every
      # ceiling in the script is the size measured on the commit that added it,
      # plus ~5 %.
      - name: The shipped library and APKs stay under their ceiling
        run: mobile/tools/size-guard.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: neezer-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-*.apk
          if-no-files-found: error

      # A TAG SHIPS ALL THREE ABIs, and the check says so instead of trusting
      # the expression above: a release built from one ABI would carry no
      # `neezer-native-arm64-v8a.apk`, and the updater of every ARM phone would
      # find nothing to install. A workflow edit that broke the default fails
      # here, before an asset is attached.
      - name: A release builds every ABI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          wanted="arm64-v8a armeabi-v7a x86_64"
          NZ_ABIS="${NZ_ABIS:-}"
          read -r -a got <<< "$NZ_ABIS"
          # `"${got[*]}"` joins with single spaces whatever the input's spacing,
          # so the comparison is on the SET, not on how it was typed.
          if [ "$(IFS=' '; echo "${got[*]}")" != "$wanted" ]; then
            echo "::error::a tag must build «$wanted», this run builds «$NZ_ABIS»"
            exit 1
          fi
          echo "   tag build: all three ABIs ($wanted)"

      # The release carries the native app under ITS OWN names, beside the
      # WebView app's `neezer.apk` (android.yaml): a person must be able to tell
      # which APK is which, and each app's updater asks its own route.
      - name: Attach the native APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            mobile/android/app/build/outputs/apk/release/neezer-native.apk
            mobile/android/app/build/outputs/apk/release/neezer-native-arm64-v8a.apk
            mobile/android/app/build/outputs/apk/release/neezer-native-armeabi-v7a.apk
            mobile/android/app/build/outputs/apk/release/neezer-native-x86_64.apk

      - name: Verify the release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          wanted="neezer-native.apk neezer-native-arm64-v8a.apk neezer-native-armeabi-v7a.apk neezer-native-x86_64.apk"
          for _ in 1 2 3 4 5 6; do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=""
            for name in $wanted; do
              echo "$names" | grep -qx "$name" || missing="$missing $name"
            done
            [ -z "$missing" ] && break
            sleep 5
          done
          echo "$names"
          if [ -n "$missing" ]; then
            echo "::error::missing from $TAG:$missing"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/assets" && mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --pattern 'neezer-native*.apk' --dir "$RUNNER_TEMP/assets"
          for name in $wanted; do
            cmp "mobile/android/app/build/outputs/apk/release/$name" "$RUNNER_TEMP/assets/$name"
            printf '   %-36s %s octets\n' "$name" "$(stat -c %s "$RUNNER_TEMP/assets/$name")"
          done
          # The WebView app's asset is android.yaml's, not this job's: its
          # absence here proves nothing, but its presence under our names would.
          if echo "$names" | grep -qx "neezer-native.apk" && echo "$names" | grep -qx "neezer.apk"; then
            echo "   both apps' assets are on $TAG (neezer.apk is the WebView one)"
          fi

      # `master` WRITES the cargo cache, every branch READS it. `actions/cache`
      # scopes an entry to the ref that saved it, so a save from a pull request is
      # a second 1.36 GB copy under `refs/pull/<n>/merge` that only that PR can
      # read — measured: two identical `mobile-apk-<hash>` entries, 1.36 GB each,
      # for the repository's 10 GB. One writer, one entry.
      - name: Save the cargo cache (master only)
        if: github.ref == 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            mobile/rust/target
          key: mobile-apk-${{ hashFiles('mobile/rust/Cargo.lock', 'desktop/Cargo.lock') }}

  # --- the emulator ----------------------------------------------------------
  # MQ1 writes `mobile/tools/ci-emulator.sh` (it starts the emulator with the
  # documented flags, waits for `sys.boot_completed`, installs the APK over the
  # OLD one and drives the routes). Until then this job says so instead of
  # pretending: a workflow that silently skips a test is a test that does not
  # exist.
  emulator:
    name: Emulator smoke (headless, KVM)
    runs-on: ubuntu-latest
    # Bounded in time: measured median 704 s, p90 908 s (15.1 min) — without it a
    # stuck emulator held 4 vCPU to GitHub's 6 h ceiling.
    timeout-minutes: 30
    needs: apk
    steps:
      - uses: actions/checkout@v4

      - name: Check for the harness
        id: harness
        run: |
          if [ -f mobile/tools/ci-emulator.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator::skipped: no harness yet (MQ1 writes mobile/tools/ci-emulator.sh)"
          fi

      # The documented recipe: /dev/kvm must be readable by the runner user.
      - name: Enable KVM
        if: steps.harness.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        if: steps.harness.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.harness.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.7"

      - uses: actions/download-artifact@v4
        if: steps.harness.outputs.present == 'true'
        with:
          name: neezer-mobile-apk
          path: mobile/android/app/build/outputs/apk/release

      # The `apk` job's `libnz_ffi.so` (every ABI of `NZ_ABIS`) and its generated
      # UniFFI Kotlin, put back where `:bridge` reads them. `ci-emulator.sh` then passes
      # `-PskipRust` and does not install the NDK/cargo-ndk: the instrumented
      # tests still build their own debug variants, they just stop rebuilding the
      # Rust tree that was already built (12 min 30 s of run 44368850444).
      - uses: actions/download-artifact@v4
        if: steps.harness.outputs.present == 'true'
        with:
          name: neezer-mobile-native
          path: mobile/android/bridge

      # The same guard the `apk` job ran, on the files that actually arrived: a
      # library that needs a `.so` the APK does not carry makes the app die at
      # `System.loadLibrary`, and an artifact is a copy — prove the copy.
      - name: The handed-over native library is the one the tests will load
        if: steps.harness.outputs.present == 'true'
        run: |
          set -euo pipefail
          # ABSOLUTE: `build-android.sh` `cd`s into `mobile/rust` before it reads
          # its argument, so a relative path would resolve under that directory
          # and the guard would answer "absent" on files that are there (measured
          # on this PR's first run — the guard refused to bless a copy it could
          # not read, which is the behaviour wanted from a guard).
          mobile/rust/build-android.sh --check-libs "$GITHUB_WORKSPACE/mobile/android/bridge/src/main/jniLibs"
          for abi in $NZ_ABIS; do
            printf '   %-12s %8s bytes\n' "$abi" \
              "$(stat -c %s "mobile/android/bridge/src/main/jniLibs/$abi/libnz_ffi.so")"
          done
          test "$(find mobile/android/bridge/build/generated/uniffi -name '*.kt' | wc -l)" -gt 0

      - name: Install the SDK, the image and the AVD
        if: steps.harness.outputs.present == 'true'
        run: |
          set -euo pipefail
          # `yes | sdkmanager --licenses` is the documented recipe, and under
          # `pipefail` it fails the step when sdkmanager has nothing left to ask
          # and closes the pipe first: "yes: standard output: Broken pipe" →
          # exit 1 (measured on the first run of this job, 2026-11-17). The
          # licences are what we want, not yes's exit status.
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            -n nz35 -k "system-images;android-35;default;x86_64" --device pixel_6 --force

      - name: Smoke
        if: steps.harness.outputs.present == 'true'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: mobile/tools/ci-emulator.sh
