# The GPUI shell: the window, the screens, the keymap, the wiring.
# Owned by D7 and the screen lots (docs/agents/desktop.md). D0 opens one empty
# omarchy window — the smallest thing that still proves the whole GPU stack
# (gpui-pre + wgpu/Vulkan + gpui-kit + gpui-omarchy) builds and paints here.

[package]
name = "neezer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neezer-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
gpui-omarchy = { workspace = true }
nz-api = { path = "../crates/nz-api" }
nz-cache = { path = "../crates/nz-cache" }
nz-model = { path = "../crates/nz-model" }
nz-player = { path = "../crates/nz-player" }
nz-audio = { path = "../crates/nz-audio" }
nz-mpris = { path = "../crates/nz-mpris" }
nz-viz = { path = "../crates/nz-viz" }
# The mobile core's shared crates. SC0 creates them empty and this lot only
# declares them, so the extraction lots (SC1, SC4, SC5, SC6) never edit a
# manifest: they move their wiring file into its crate and re-export it here.
# `nz-audio` is asked for with `default-features = false` inside the crates that
# use it, which keeps `cpal` off the Android build (feature unification still
# enables it for THIS binary, where the output stack is wanted).
nz-analysis = { path = "../crates/nz-analysis" }
nz-offline = { path = "../crates/nz-offline" }
nz-remote = { path = "../crates/nz-remote" }
nz-party = { path = "../crates/nz-party" }
# Local transcription: the app reads the sidecar, the model pins, the token path
# and the control words. `default-features = false` keeps whisper.cpp, Vulkan and
# the decoders out of the graphical binary — they belong to the
# `neezer-transcribe` child (T4's size and RSS measurements).
nz-transcribe = { path = "../crates/nz-transcribe", default-features = false }
# The genre studio's measurement and training cores, linked natively: the page
# compiles the same crates to WebAssembly (webapp/measure, webapp/trainer), so
# the numbers and the head are the web app's own arithmetic, not a port (D16).
measure = { path = "../../webapp/measure" }
trainer = { path = "../../webapp/trainer" }
# The listen party's time-sync estimators (`webapp/appcore/src/sync.rs`: the NTP
# clock, the host's anchor fit, a guest's output-clock bridge), linked natively so
# the desktop and the page schedule on the SAME arithmetic (D15b).
appcore = { path = "../../webapp/appcore" }
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
directories = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# The keyboard journey runs through GPUI's own test harness (`#[gpui::test]`),
# which only exists when `test-support` is on. It is asked from `gpui-pre`
# itself, not through `gpui-kit`, because gpui-kit's test-support feature also
# resolves its optional `gpui-fast` backend — a second GPUI whose macOS
# dependency pins conflict with the snapshot we build against.
gpui = { workspace = true, features = ["test-support"] }
# A test builds a `RenderImage` the way the app gets one (decoded pixels), to
# prove the byte accounting without a window: the same crate the client decodes
# with is already in the workspace (`nz-cache`).
image = { workspace = true }
