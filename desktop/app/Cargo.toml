# The GPUI shell: the window, the screens, the keymap, the wiring.
# Owned by D7 and the screen lots (docs/agents/desktop.md). D0 opens one empty
# omarchy window — the smallest thing that still proves the whole GPU stack
# (gpui-pre + wgpu/Vulkan + gpui-kit + gpui-omarchy) builds and paints here.

[package]
name = "neezer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neezer-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { workspace = true }
gpui-omarchy = { workspace = true }
nz-api = { path = "../crates/nz-api" }
nz-cache = { path = "../crates/nz-cache" }
nz-model = { path = "../crates/nz-model" }
nz-player = { path = "../crates/nz-player" }
nz-audio = { path = "../crates/nz-audio" }
nz-mpris = { path = "../crates/nz-mpris" }
nz-viz = { path = "../crates/nz-viz" }
# The genre studio's measurement and training cores, linked natively: the page
# compiles the same crates to WebAssembly (webapp/measure, webapp/trainer), so
# the numbers and the head are the web app's own arithmetic, not a port (D16).
measure = { path = "../../webapp/measure" }
trainer = { path = "../../webapp/trainer" }
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
directories = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# The keyboard journey runs through GPUI's own test harness (`#[gpui::test]`),
# which only exists when `test-support` is on. It is asked from `gpui-pre`
# itself, not through `gpui-kit`, because gpui-kit's test-support feature also
# resolves its optional `gpui-fast` backend — a second GPUI whose macOS
# dependency pins conflict with the snapshot we build against.
gpui = { workspace = true, features = ["test-support"] }
