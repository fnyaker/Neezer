# The downloads worker, shared by the desktop app and the mobile core. SC0
# creates the empty crate and its manifest; SC4 moves everything of
# `desktop/app/src/wiring/offline.rs` that is not GPUI in here and leaves the
# `cx`/`Entity` updates as a desktop adapter (docs/agents/mobile.md, "SC0" and
# "SC4").
#
# No GPUI, no cpal, no zbus, no whisper: the library is plain tokio + `nz-api` +
# `nz-cache`, compiled for Android as well.

[package]
name = "nz-offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nz-api = { path = "../nz-api" }
nz-cache = { path = "../nz-cache" }
nz-model = { path = "../nz-model" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The playback tests that move with the worker run a REAL engine while a set
# downloads: a bulk download that starves the player fails the test. Dev only —
# the library never touches the engine, and `cargo ndk … check -p nz-offline`
# builds the library alone, so no output stack reaches Android.
nz-audio = { path = "../nz-audio", default-features = false }
