# The listen party, shared: host and guest. SC0 creates the empty crate and its
# manifest; SC6 moves `desktop/app/src/wiring/party_guest.rs` whole (0 GPUI) and
# the protocol part of `party_host.rs` in here, leaving that file's GPUI uses as
# a desktop adapter (docs/agents/mobile.md, "SC0" and "SC6").
#
# `nz-audio` carries the guest's `PartyChannel` and the output clock; `appcore`
# carries the estimators the page runs too. No GPUI, no cpal, no zbus, no
# whisper. `symphonia`/`rubato`/`reqwest` are what the guest's prefetch path
# decodes and resamples with, and both files reach the server through `nz-api`'s
# typed send (hence `reqwest::Method`).

[package]
name = "nz-party"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
appcore = { path = "../../../webapp/appcore" }
nz-api = { path = "../nz-api" }
nz-audio = { path = "../nz-audio", default-features = false }
nz-cache = { path = "../nz-cache" }
nz-model = { path = "../nz-model" }
nz-player = { path = "../nz-player" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { workspace = true }
# The guest's chunk decoder registers symphonia's Opus decoder by its
# fully-qualified path (`guest.rs#decode_chunk`), which no `use` line shows:
# SC0's manifest missed it, exactly as it did for `nz-analysis` (SC1). It was
# already a workspace pin, so this adds a dependency EDGE and no package.
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
