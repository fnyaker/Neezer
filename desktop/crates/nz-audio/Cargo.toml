# The audio engine: source, decode, mix (gapless/crossfade), DSP, output, tap.
# Owned by D5 and D6 (docs/agents/desktop.md).
#
# The pinned stack is compiled here on purpose: this crate is what proves, on
# every push, that cpal finds PipeWire and ALSA, that symphonia's Opus adapter
# builds its bundled libopus, and that the lock-free ring the output callback
# is written against works.

[package]
name = "nz-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The desktop's device output (PipeWire, then ALSA) is cpal's. A platform that
# drives the mixer itself — Android's AAudio, later CoreAudio — builds this
# crate with `default-features = false`: nothing that names cpal is compiled
# then, which is what lets `nz-audio` build for a target where
# `cpal::HostId::PipeWire` does not exist at all (SC2, docs/agents/mobile.md).
default = ["cpal"]
cpal = ["dep:cpal"]

[dependencies]
nscore = { path = "../../../android/nscore" }
cpal = { workspace = true, optional = true }
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
signalsmith-stretch = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
