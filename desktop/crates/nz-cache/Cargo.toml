# The local SQLite file: API cache, covers, play cache, downloads, settings,
# queue snapshot. Owned by D3 (docs/agents/desktop.md, "Caches").

[package]
name = "nz-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The quality of a cached stream is part of the file name and of every key, and
# the app already types it once: never keep a second spelling of it here.
nz-model = { path = "../nz-model" }
