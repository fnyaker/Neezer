# The visualiser's geometry: bars and the oscilloscope, computed from the same
# analyser the web app uses. Owned by V1 (docs/agents/desktop.md).
#
# The only dependency is the web app's own `rhythm` (path, read-only): its
# `viz_bars::Bars` and `viz_scope::Scope` ARE the arithmetic the page runs, so
# the desktop cannot drift from what the browser draws. Nothing here does I/O.

[package]
name = "nz-viz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rhythm = { path = "../../../webapp/rhythm" }
