<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The web app's mark, so the launcher entry, the installed web player and
       the desktop window wear the same face. A single square, one gradient,
       one glyph: it stays readable at the launcher's 32 px. -->
  <defs>
    <linearGradient id="neezer-desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a238ff"/>
      <stop offset="1" stop-color="#ff0092"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#neezer-desktop)"/>
  <path d="M205 160 L205 352 L368 256 Z" fill="#ffffff"/>
</svg>
