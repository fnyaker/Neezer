<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0B" />
    <title>Neezer</title>

    <!-- The Sillon theme, applied BEFORE the first frame: a session in Papier
         (or in Pochette, whose accent comes from the sleeve, or with a custom
         accent) must not flash the dark default while the bundle loads. A
         classic script — no module, no defer — so it blocks the parser and
         runs before <body> paints; it is a file and not inline because the CSP
         is `script-src 'self'`. lib/theme.js reads the same keys afterwards and
         owns the rest of the session. -->
    <script src="/app/theme-boot.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neezer" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
